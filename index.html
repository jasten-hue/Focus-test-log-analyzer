<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FOCUS TEST LOG ANALYZER</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #202124;
}

.header {
    background: #1f2937;
    color: white;
    padding: 20px 28px;
}

.header h1 {
    margin: 0 0 5px;
    font-size: 24px;
}

.header p {
    margin: 0;
    opacity: 0.8;
    font-size: 13px;
}

.container {
    max-width: 1500px;
    margin: 20px auto;
    padding: 0 18px;
}

.card {
    background: white;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.input-title {
    font-weight: bold;
    margin-bottom: 10px;
}

textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    padding: 12px;
    border: 1px solid #cfd4da;
    border-radius: 7px;
    font-family: Consolas, monospace;
    font-size: 12px;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
}

button,
.file-label {
    border: 0;
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
}

.analyze-btn {
    background: #2563eb;
    color: white;
}

.clear-btn {
    background: #e5e7eb;
    color: #111827;
}

.file-label {
    background: #059669;
    color: white;
    display: inline-flex;
    align-items: center;
}

#fileInput {
    display: none;
}

.summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.summary-box {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 15px;
    background: #fafafa;
}

.summary-box .label {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 6px;
}

.summary-box .number {
    font-size: 25px;
    font-weight: bold;
}

.good-number {
    color: #059669;
}

.ng-number {
    color: #dc2626;
}


/* ============================================================
   SEARCH + FILTER
   ============================================================ */

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.search-box {
    flex: 1;
    min-width: 250px;
    padding: 11px 13px;
    border: 1px solid #cfd4da;
    border-radius: 7px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
}

.filter-btn {
    background: #e5e7eb;
    color: #374151;
}

.filter-btn.active {
    background: #2563eb;
    color: white;
}

.filter-btn.ng-filter.active {
    background: #dc2626;
    color: white;
}

.filter-btn.good-filter.active {
    background: #059669;
    color: white;
}


/* ============================================================
   RESULT LIST
   ============================================================ */

.result-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.sn-card {
    border: 1px solid #d1d5db;
    border-radius: 9px;
    overflow: hidden;
    background: white;
}

.sn-header {
    display: grid;
    grid-template-columns:
        50px
        minmax(180px, 1fr)
        110px
        180px
        110px;

    align-items: center;
    gap: 12px;
    padding: 13px 15px;
    cursor: pointer;
    background: #fafafa;
}

.sn-header:hover {
    background: #f3f4f6;
}

.sn-number {
    color: #6b7280;
    font-weight: bold;
}

.sn-name {
    font-family: Consolas, monospace;
    font-weight: bold;
    word-break: break-all;
}

.status {
    display: inline-block;
    text-align: center;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.status.good {
    background: #dcfce7;
    color: #166534;
}

.status.ng {
    background: #fee2e2;
    color: #991b1b;
}

.ng-description {
    color: #dc2626;
    font-weight: bold;
    font-size: 13px;
}

.good-description {
    color: #059669;
    font-weight: bold;
    font-size: 13px;
}

.test-count {
    color: #6b7280;
    font-size: 12px;
    text-align: right;
}

.sn-content {
    display: none;
    border-top: 1px solid #e5e7eb;
    padding: 15px;
}

.sn-card.expanded .sn-content {
    display: block;
}


/* ============================================================
   TEST LOG
   ============================================================ */

.test-log {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    margin-bottom: 15px;
    overflow: hidden;
}

.test-header {
    background: #f3f4f6;
    padding: 11px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.test-title {
    font-weight: bold;
}

.test-time {
    font-family: Consolas, monospace;
    color: #6b7280;
    font-size: 12px;
}

.test-body {
    padding: 12px;
}

.section-title {
    margin: 14px 0 8px;
    font-size: 14px;
    font-weight: bold;
    color: #374151;
}

.mode-title {
    font-size: 15px;
    padding: 8px 10px;
    border-radius: 5px;
    margin-top: 12px;
    margin-bottom: 8px;
    font-weight: bold;
}

.day-mode-title {
    background: #fff7ed;
    color: #c2410c;
}

.night-mode-title {
    background: #eef2ff;
    color: #3730a3;
}


/* ============================================================
   TABLE
   ============================================================ */

.mtf-table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}

th {
    background: #374151;
    color: white;
    text-align: left;
    padding: 9px;
    white-space: nowrap;
}

td {
    padding: 8px 9px;
    border-bottom: 1px solid #e5e7eb;
    white-space: nowrap;
}

tr.pass-row td {
    background: #f9fffb;
}

tr.ng-row td {
    background: #fff1f2;
}

.result-pass {
    color: #15803d;
    font-weight: bold;
}

.result-ng {
    color: #dc2626;
    font-weight: bold;
}


/* ============================================================
   GRAPH
   ============================================================ */

.graph-container {
    width: 100%;
    height: 420px;
    margin-top: 15px;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}


/* ============================================================
   OTHER
   ============================================================ */

.empty {
    padding: 35px;
    text-align: center;
    color: #6b7280;
}

.error {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #fecaca;
    padding: 12px;
    border-radius: 7px;
    margin-bottom: 15px;
    display: none;
}

.format-info {
    margin-top: 8px;
    color: #6b7280;
    font-size: 12px;
}

.no-results {
    padding: 30px;
    text-align: center;
    color: #6b7280;
}


/* ============================================================
   RESPONSIVE
   ============================================================ */

@media (max-width: 900px) {

    .summary-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .sn-header {
        grid-template-columns:
            35px
            1fr
            80px;
    }

    .ng-description,
    .good-description,
    .test-count {
        grid-column: 2 / 4;
        text-align: left;
    }
}

@media (max-width: 600px) {

    .summary-grid {
        grid-template-columns: 1fr 1fr;
    }

    .sn-header {
        grid-template-columns:
            30px
            1fr
            70px;
    }
}

</style>
</head>

<body>


<div class="header">

    <h1>FOCUS TEST LOG ANALYZER</h1>

    <p>
        MTF VIS / IR log and SPC data analyzer
    </p>

</div>


<div class="container">


<!-- ============================================================
     INPUT
============================================================ -->

<div class="card">

    <div class="input-title">
        Paste Log / CSV Data
    </div>

    <textarea
        id="logInput"
        placeholder="Paste your .log or .csv data here..."
    ></textarea>

    <div class="buttons">

        <label class="file-label">

            Browse Data

            <input
                type="file"
                id="fileInput"
                accept=".log,.txt,.csv"
            >

        </label>

        <button
            class="analyze-btn"
            onclick="analyzeLog()"
        >
            Analyze
        </button>

        <button
            class="clear-btn"
            onclick="clearAll()"
        >
            Clear
        </button>

    </div>

    <div
        id="fileInfo"
        class="format-info"
    ></div>

</div>


<!-- ============================================================
     ERROR
============================================================ -->

<div
    id="errorBox"
    class="error"
></div>


<!-- ============================================================
     SUMMARY
============================================================ -->

<div
    id="summaryCard"
    class="card"
    style="display:none;"
>

    <div class="input-title">
        Test Summary
    </div>

    <div class="summary-grid">

        <div class="summary-box">

            <div class="label">
                Total SN
            </div>

            <div
                id="totalSN"
                class="number"
            >
                0
            </div>

        </div>


        <div class="summary-box">

            <div class="label">
                GOOD
            </div>

            <div
                id="goodSN"
                class="number good-number"
            >
                0
            </div>

        </div>


        <div class="summary-box">

            <div class="label">
                NG
            </div>

            <div
                id="ngSN"
                class="number ng-number"
            >
                0
            </div>

        </div>


        <div class="summary-box">

            <div class="label">
                Test Logs
            </div>

            <div
                id="totalTests"
                class="number"
            >
                0
            </div>

        </div>

    </div>

</div>


<!-- ============================================================
     RESULTS
============================================================ -->

<div
    id="resultsCard"
    class="card"
    style="display:none;"
>

    <div class="input-title">
        SN Results
    </div>


    <!-- SEARCH + FILTER -->

    <div class="toolbar">

        <input
            id="snSearch"
            class="search-box"
            type="text"
            placeholder="Search SN..."
            oninput="applyFilters()"
        >


        <button
            id="filterAll"
            class="filter-btn active"
            onclick="setFilter('ALL')"
        >
            ALL
        </button>


        <button
            id="filterNG"
            class="filter-btn ng-filter"
            onclick="setFilter('NG')"
        >
            🔴 NG ONLY
        </button>


        <button
            id="filterGOOD"
            class="filter-btn good-filter"
            onclick="setFilter('GOOD')"
        >
            🟢 GOOD ONLY
        </button>

    </div>


    <div
        id="resultList"
        class="result-list"
    ></div>

</div>


</div>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<script>


/* ============================================================
   GLOBAL DATA
============================================================ */

let groupedData = {};

let chartInstances = new Map();

let currentFilter = "ALL";

let originalRecords = [];


/* ============================================================
   FILE BROWSER
============================================================ */

document
    .getElementById("fileInput")
    .addEventListener(
        "change",
        function(event) {

            const file =
                event.target.files[0];

            if (!file) {
                return;
            }

            const reader =
                new FileReader();

            reader.onload =
                function(e) {

                    document
                        .getElementById("logInput")
                        .value =
                            e.target.result;

                    document
                        .getElementById("fileInfo")
                        .textContent =
                            "Loaded: " +
                            file.name +
                            " (" +
                            file.size.toLocaleString() +
                            " bytes)";

                };

            reader.onerror =
                function() {

                    showError(
                        "Unable to read the selected file."
                    );

                };

            reader.readAsText(file);

        }
    );


/* ============================================================
   MAIN ANALYZER
============================================================ */

function analyzeLog() {

    hideError();

    const raw =
        document
            .getElementById("logInput")
            .value;

    if (!raw.trim()) {

        showError(
            "Please paste a log or browse for a file first."
        );

        return;
    }


    groupedData = {};

    originalRecords = [];


    const format =
        detectFormat(raw);


    let records = [];


    if (format === "CSV") {

        records =
            parseCSVData(raw);

    } else {

        records =
            parseOriginalLog(raw);

    }


    /*
     * Automatic fallback.
     */

    if (records.length === 0) {

        if (format === "CSV") {

            records =
                parseOriginalLog(raw);

        } else {

            records =
                parseCSVData(raw);

        }

    }


    if (records.length === 0) {

        showError(
            "No MTF data was found. The file was loaded, but its structure could not be recognized."
        );

        return;
    }


    /*
     * Preserve every record.
     */

    originalRecords =
        records.map(
            (record, index) => {

                record.originalIndex =
                    index;

                return record;

            }
        );


    groupRecords(
        originalRecords
    );


    renderSummary();

    renderResults();

}


/* ============================================================
   FORMAT DETECTION
============================================================ */

function detectFormat(text) {

    const lower =
        text.toLowerCase();


    if (
        lower.includes("pcba,") &&
        (
            lower.includes("stamptime") ||
            lower.includes("workno")
        )
    ) {

        return "CSV";
    }


    if (
        lower.includes("item_mtf") ||
        lower.includes("spec: lower")
    ) {

        return "LOG";
    }


    if (
        lower.includes(",") &&
        lower.includes("lower")
    ) {

        return "CSV";
    }


    return "LOG";
}


/* ============================================================
   CSV LINE PARSER
============================================================ */

function parseCSVLine(line) {

    const values = [];

    let current = "";

    let inQuotes = false;


    for (
        let i = 0;
        i < line.length;
        i++
    ) {

        const char =
            line[i];


        if (char === '"') {

            if (
                inQuotes &&
                line[i + 1] === '"'
            ) {

                current += '"';

                i++;

            } else {

                inQuotes =
                    !inQuotes;

            }

        } else if (
            char === "," &&
            !inQuotes
        ) {

            values.push(
                current.trim()
            );

            current = "";

        } else {

            current += char;

        }

    }


    values.push(
        current.trim()
    );


    return values;
}


/* ============================================================
   CSV PARSER
============================================================ */

function parseCSVData(text) {

    const records = [];


    const lines =
        text
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .split("\n");


    let headerIndex = -1;


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const lower =
            lines[i].toLowerCase();


        if (
            lower.includes("pcba") &&
            lower.includes("workno") &&
            lower.includes("stamptime")
        ) {

            headerIndex = i;

            break;
        }

    }


    if (headerIndex === -1) {

        return records;
    }


    const headers =
        parseCSVLine(
            lines[headerIndex]
        );


    const specRows = {};


    for (
        let i = headerIndex + 1;
        i < lines.length;
        i++
    ) {

        const row =
            parseCSVLine(
                lines[i]
            );


        if (!row.length) {
            continue;
        }


        const first =
            String(row[0] || "")
                .trim()
                .toLowerCase();


        if (
            [
                "lower",
                "upper",
                "min",
                "max",
                "mean",
                "sigma",
                "cpl",
                "cpu",
                "cplu"
            ].includes(first)
        ) {

            specRows[first] =
                row;

        }

    }


    /*
     * Find all MTF columns.
     */

    const measurementColumns = [];


    for (
        let i = 0;
        i < headers.length;
        i++
    ) {

        const header =
            String(
                headers[i] || ""
            ).trim();


        if (
            header
                .toUpperCase()
                .includes("MTF")
        ) {

            /*
             * Remove these four items.
             */

            if (
                isExcludedMTFItem(
                    header
                )
            ) {

                continue;
            }


            measurementColumns.push(i);

        }

    }


    if (
        measurementColumns.length === 0
    ) {

        return records;
    }


    /*
     * Read every actual data row.
     */

    for (
        let rowIndex = headerIndex + 1;
        rowIndex < lines.length;
        rowIndex++
    ) {

        const row =
            parseCSVLine(
                lines[rowIndex]
            );


        if (!row.length) {
            continue;
        }


        const first =
            String(row[0] || "")
                .trim()
                .toLowerCase();


        if (
            [
                "lower",
                "upper",
                "min",
                "max",
                "mean",
                "sigma",
                "cpl",
                "cpu",
                "cplu"
            ].includes(first)
        ) {

            continue;
        }


        if (
            row.every(
                x =>
                    String(x).trim() === ""
            )
        ) {

            continue;
        }


        const sn =
            getFirstExistingValue(
                row,
                [
                    findHeader(
                        headers,
                        "SN"
                    ),

                    findHeader(
                        headers,
                        "SERIAL"
                    ),

                    findHeader(
                        headers,
                        "SERIALNUMBER"
                    ),

                    findHeader(
                        headers,
                        "PCBA"
                    )
                ]
            );


        const workNo =
            getFirstExistingValue(
                row,
                [
                    findHeader(
                        headers,
                        "WORKNO"
                    ),

                    findHeader(
                        headers,
                        "WORKNO."
                    ),

                    findHeader(
                        headers,
                        "WORK NO"
                    )
                ]
            );


        const stampTime =
            getFirstExistingValue(
                row,
                [
                    findHeader(
                        headers,
                        "STAMPTIME"
                    ),

                    findHeader(
                        headers,
                        "DATE_TIME"
                    ),

                    findHeader(
                        headers,
                        "DATETIME"
                    )
                ]
            );


        const measurements = [];


        for (
            const columnIndex
            of measurementColumns
        ) {

            const itemName =
                String(
                    headers[columnIndex] || ""
                ).trim();


            const value =
                toNumber(
                    row[columnIndex]
                );


            if (
                value === null
            ) {

                continue;
            }


            const lower =
                getSpecValue(
                    specRows.lower,
                    columnIndex
                );


            const upper =
                getSpecValue(
                    specRows.upper,
                    columnIndex
                );


            const result =
                evaluateResult(
                    value,
                    lower,
                    upper
                );


            measurements.push({

                name:
                    itemName,

                value:
                    value,

                lower:
                    lower,

                upper:
                    upper,

                result:
                    result,

                type:
                    getMTFType(
                        itemName
                    )

            });

        }


        if (
            measurements.length > 0
        ) {

            records.push({

                sn:
                    cleanSN(sn),

                workNo:
                    workNo || "",

                time:
                    stampTime || "",

                source:
                    "CSV",

                measurements:
                    measurements

            });

        }

    }


    return records;
}


/* ============================================================
   ORIGINAL LOG PARSER
============================================================ */

function parseOriginalLog(text) {

    const records = [];


    const lines =
        text
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .split("\n");


    let currentRecord = null;


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i];


        /*
         * Detect SN.
         */

        const snMatch =
            line.match(
                /(?:Load SNFile:\s*|SN:\s*)([A-Za-z0-9._-]+)/
            );


        if (snMatch) {

            if (
                currentRecord &&
                currentRecord.measurements.length > 0
            ) {

                records.push(
                    currentRecord
                );

            }


            currentRecord = {

                sn:
                    cleanSN(
                        snMatch[1]
                    ),

                workNo:
                    "",

                time:
                    "",

                source:
                    "LOG",

                measurements:
                    []

            };


            continue;
        }


        /*
         * Date / Time.
         */

        const dateMatch =
            line.match(
                /Date_Time:\s*(.+)/i
            );


        if (
            dateMatch &&
            currentRecord
        ) {

            currentRecord.time =
                dateMatch[1].trim();

            continue;
        }


        /*
         * MTF item.
         */

        const itemMatch =
            line.match(
                /Item:\s*([^;]+);\s*Value:\s*([+-]?\d+(?:\.\d+)?)/i
            );


        if (
            itemMatch &&
            currentRecord
        ) {

            const name =
                itemMatch[1].trim();


            /*
             * Ignore excluded MTF items.
             */

            if (
                isExcludedMTFItem(
                    name
                )
            ) {

                continue;
            }


            const value =
                Number(
                    itemMatch[2]
                );


            let lower = null;

            let upper = null;


            /*
             * Search nearby specification.
             */

            for (
                let j = i;
                j < Math.min(
                    i + 5,
                    lines.length
                );
                j++
            ) {

                const lowerMatch =
                    lines[j].match(
                        /SPEC:\s*LOWER\s*=\s*([+-]?\d+(?:\.\d+)?)/i
                    );


                if (
                    lowerMatch
                ) {

                    lower =
                        Number(
                            lowerMatch[1]
                        );

                    break;
                }

            }


            /*
             * Search for upper if available.
             */

            for (
                let j = i;
                j < Math.min(
                    i + 5,
                    lines.length
                );
                j++
            ) {

                const upperMatch =
                    lines[j].match(
                        /SPEC:\s*UPPER\s*=\s*([+-]?\d+(?:\.\d+)?)/i
                    );


                if (
                    upperMatch
                ) {

                    upper =
                        Number(
                            upperMatch[1]
                        );

                    break;
                }

            }


            const result =
                evaluateResult(
                    value,
                    lower,
                    upper
                );


            currentRecord
                .measurements
                .push({

                    name:
                        name,

                    value:
                        value,

                    lower:
                        lower,

                    upper:
                        upper,

                    result:
                        result,

                    type:
                        getMTFType(
                            name
                        )

                });

        }

    }


    /*
     * Save final record.
     */

    if (
        currentRecord &&
        currentRecord.measurements.length > 0
    ) {

        records.push(
            currentRecord
        );

    }


    /*
     * Fallback.
     */

    if (
        records.length === 0
    ) {

        const measurements = [];


        for (
            const line of lines
        ) {

            const match =
                line.match(
                    /Item:\s*([^;]+);\s*Value:\s*([+-]?\d+(?:\.\d+)?)/i
                );


            if (!match) {
                continue;
            }


            const name =
                match[1].trim();


            if (
                isExcludedMTFItem(
                    name
                )
            ) {

                continue;
            }


            const value =
                Number(
                    match[2]
                );


            measurements.push({

                name:
                    name,

                value:
                    value,

                lower:
                    null,

                upper:
                    null,

                result:
                    "GOOD",

                type:
                    getMTFType(
                        name
                    )

            });

        }


        if (
            measurements.length > 0
        ) {

            const snMatch =
                text.match(
                    /(?:^|\n)\s*SN:\s*([A-Za-z0-9._-]+)/i
                );


            records.push({

                sn:
                    snMatch
                        ? cleanSN(
                            snMatch[1]
                          )
                        : "",

                workNo:
                    "",

                time:
                    "",

                source:
                    "LOG",

                measurements:
                    measurements

            });

        }

    }


    return records;
}


/* ============================================================
   GROUP RECORDS
============================================================ */

function groupRecords(records) {

    groupedData = {};


    records.forEach(
        function(record, index) {

            const sn =
                record.sn &&
                record.sn.trim()
                    ? record.sn.trim()
                    : "NO SN";


            if (
                !groupedData[sn]
            ) {

                groupedData[sn] = {

                    sn:
                        sn,

                    tests:
                        [],

                    overall:
                        "GOOD",

                    dayNG:
                        false,

                    nightNG:
                        false

                };

            }


            record.originalIndex =
                index;


            groupedData[sn]
                .tests
                .push(record);


            /*
             * Check NG by MODE.
             */

            record.measurements
                .forEach(
                    function(m) {

                        if (
                            m.result !== "NG"
                        ) {

                            return;
                        }


                        groupedData[sn]
                            .overall =
                                "NG";


                        /*
                         * IR = NIGHT MODE.
                         * Everything else = DAY MODE.
                         */

                        if (
                            m.type === "NIGHT"
                        ) {

                            groupedData[sn]
                                .nightNG =
                                    true;

                        } else {

                            groupedData[sn]
                                .dayNG =
                                    true;

                        }

                    }
                );

        }
    );


    /*
     * Sort every SN's test logs.
     *
     * Time is used when available.
     * Otherwise original log order is retained.
     */

    Object.values(
        groupedData
    ).forEach(
        function(snData) {

            snData.tests.sort(
                function(a, b) {

                    const ta =
                        parseTimeValue(
                            a.time
                        );

                    const tb =
                        parseTimeValue(
                            b.time
                        );


                    if (
                        ta !== null &&
                        tb !== null
                    ) {

                        return ta - tb;
                    }


                    return (
                        a.originalIndex -
                        b.originalIndex
                    );

                }
            );


            snData.tests.forEach(
                function(test, index) {

                    test.testNumber =
                        index + 1;

                }
            );

        }
    );

}


/* ============================================================
   SUMMARY
============================================================ */

function renderSummary() {

    const snList =
        Object.values(
            groupedData
        );


    let good = 0;

    let ng = 0;

    let tests = 0;


    snList.forEach(
        function(item) {

            if (
                item.overall === "NG"
            ) {

            } else {

                good++;

            }


            tests +=

        }

    document

            snList.length;


    document
        .getElementById("goodSN")
        .textContent =
            good;


    document
        .getElementById("ngSN")
        .textContent =
            ng;


    document
        .getElementById("totalTests")
        .textContent =
            tests;


    document
        .getElementById("summaryCard")
        .style.display =

}

============================================================ */

function setFilter(filter) {

    currentFilter =
        filter;


    document
        .getElementById("filterAll")
        .classList.toggle(
            "active",
            filter === "ALL"
        );


    document
        .getElementById("filterNG")
        .classList.toggle(
            "active",
            filter === "NG"
        );


    document
        .getElementById("filterGOOD")
        .classList.toggle(
            "active",
            filter === "GOOD"
        );


    applyFilters();

}


/* ============================================================
   SEARCH
============================================================ */

function applyFilters() {

    const search =
        document
            .getElementById("snSearch")
            .value
            .trim()
            .toLowerCase();


    const cards =
        document.querySelectorAll(
            ".sn-card"
        );


    let visible = 0;


    cards.forEach(
        function(card) {

            const sn =
                card.dataset.sn
                    .toLowerCase();


            const status =
                card.dataset.status;


            const matchesSearch =
                sn.includes(search);


            const matchesFilter =
                currentFilter === "ALL" ||
                (
                    currentFilter === "NG" &&
                    status === "NG"
                ) ||
                (
                    currentFilter === "GOOD" &&
                    status === "GOOD"
                );


            const show =
                matchesSearch &&
                matchesFilter;


            card.style.display =
                show
                    ? ""
                    : "none";


            if (show) {
                visible++;
            }

        }
    );


    const noResults =
        document.getElementById(
            "noFilterResults"
        );


    if (
        noResults
    ) {

        noResults.remove();

    }


    if (
        visible === 0
    ) {

        const container =
            document.getElementById(
                "resultList"
            );


        const message =
            document.createElement(
                "div"
            );


        message.id =
            "noFilterResults";


        message.className =
            "no-results";


        message.textContent =
            "No SN matches the current search/filter.";


        container.appendChild(
            message
        );

    }

}


/* ============================================================
   RENDER RESULTS
============================================================ */

function renderResults() {

    const container =
        document
            .getElementById(
                "resultList"
            );


    container.innerHTML = "";


    const snList =
        Object.values(
            groupedData
        );


    /*
     * Sequential SN order.
     *
     * Natural sorting makes:
     *
     * SN1
     * SN2
     * SN10
     *
     * instead of:
     *
     * SN1
     * SN10
     * SN2
     */

    snList.sort(
        function(a, b) {

            return naturalCompare(
                a.sn,
                b.sn
            );

        }
    );


    if (
        snList.length === 0
    ) {

        container.innerHTML =
            '<div class="empty">No results found.</div>';

        return;
    }


    snList.forEach(
        function(snData, index) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "sn-card";


            card.dataset.sn =
                snData.sn;


            card.dataset.status =
                snData.overall;


            /*
             * Header.
             */

            const header =
                document.createElement(
                    "div"
                );


            header.className =
                "sn-header";


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "sn-number";


            number.textContent =
                index + 1;


            const sn =
                document.createElement(
                    "div"
                );


            sn.className =
                "sn-name";


            sn.textContent =
                snData.sn;


            const status =
                document.createElement(
                    "div"
                );


            status.className =
                "status " +
                (
                    snData.overall === "NG"
                        ? "ng"
                        : "good"
                );


            status.textContent =
                snData.overall;


            /*
             * NG description.
             *
             * DAY NG ALWAYS HAS PRIORITY.
             */

            const description =
                document.createElement(
                    "div"
                );


            if (
                snData.overall === "NG"
            ) {

                description.className =
                    "ng-description";


                if (
                    snData.dayNG
                ) {

                    description.textContent =
                        "DAY MODE NG";

                } else if (
                    snData.nightNG
                ) {

                    description.textContent =
                        "NIGHT MODE NG";

                } else {

                    description.textContent =
                        "NG";

                }

            } else {

                description.className =
                    "good-description";

                description.textContent =
                    "GOOD";

            }


            const count =
                document.createElement(
                    "div"
                );


            count.className =
                "test-count";


            count.textContent =
                snData.tests.length +
                (
                    snData.tests.length === 1
                        ? " test log"
                        : " test logs"
                );


            header.appendChild(number);

            header.appendChild(sn);

            header.appendChild(status);

            header.appendChild(description);

            header.appendChild(count);


            /*
             * Content.
             */

            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "sn-content";


            /*
             * Every test log remains separated.
             */

            snData.tests.forEach(
                function(test) {

                    content.appendChild(
                        createTestLog(
                            snData,
                            test
                        )
                    );

                }
            );


            /*
             * Expand / collapse.
             */

            header.addEventListener(
                "click",
                function() {

                    card.classList.toggle(
                        "expanded"
                    );


                    if (
                        card.classList.contains(
                            "expanded"
                        )
                    ) {

                        setTimeout(
                            function() {

                                content
                                    .querySelectorAll(
                                        "canvas"
                                    )
                                    .forEach(
                                        function(canvas) {

                                            drawChart(
                                                canvas
                                            );

                                        }
                                    );

                            },
                            50
                        );

                    }

                }
            );


            card.appendChild(header);

            card.appendChild(content);

            container.appendChild(card);

        }
    );


    document
        .getElementById(
            "resultsCard"
        )
        .style.display =
            "block";


    applyFilters();

}


/* ============================================================
   CREATE TEST LOG
============================================================ */

function createTestLog(
    snData,
    test
) {

    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "test-log";


    const header =
        document.createElement(
            "div"
        );


    header.className =
        "test-header";


    const title =
        document.createElement(
            "div"
        );


    title.className =
        "test-title";


    title.textContent =
        "Test Log " +
        test.testNumber;


    const time =
        document.createElement(
            "div"
        );


    time.className =
        "test-time";


    time.textContent =
        test.time ||
        "Time not available";


    header.appendChild(title);

    header.appendChild(time);


    const body =
        document.createElement(
            "div"
        );


    body.className =
        "test-body";


    /*
     * Sort measurements first.
     *
     * DAY MODE:
     * 1A_1
     * 1A_2
     * 1A_3
     * ...
     *
     * NIGHT MODE:
     * 1B_IR_1
     * 1B_IR_2
     * ...
     */

    const measurements =
        [...test.measurements]
            .sort(
                naturalMeasurementCompare
            );


    /*
     * DAY MODE
     *
     * Everything that isn't IR.
     */

    const day =
        measurements.filter(
            m =>
                m.type === "DAY"
        );


    /*
     * NIGHT MODE
     *
     * IR measurements.
     */

    const night =
        measurements.filter(
            m =>
                m.type === "NIGHT"
        );


    /*
     * DAY FIRST.
     */

    if (
        day.length > 0
    ) {

        body.appendChild(
            createModeSection(
                "DAY MODE",
                day,
                "day-mode-title"
            )
        );

    }


    /*
     * NIGHT SECOND.
     */

    if (
        night.length > 0
    ) {

        body.appendChild(
            createModeSection(
                "NIGHT MODE",
                night,
                "night-mode-title"
            )
        );

    }


    /*
     * GRAPH
     *
     * Combined DAY -> NIGHT sequence.
     */

    if (
        measurements.length > 0
    ) {

        const chartTitle =
            document.createElement(
                "div"
            );


        chartTitle.className =
            "section-title";


        chartTitle.textContent =
            "MTF Graph — DAY MODE → NIGHT MODE";


        body.appendChild(
            chartTitle
        );


        const graph =
            document.createElement(
                "div"
            );


        graph.className =
            "graph-container";


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.chartData =
            measurements;


        graph.appendChild(
            canvas
        );


        body.appendChild(
            graph
        );

    }


    wrapper.appendChild(header);

    wrapper.appendChild(body);


    return wrapper;
}

/* ============================================================
   GRAPH
============================================================ */

function drawChart(canvas) {

    if (
        !canvas ||
        !canvas.chartData
    ) {

        return;
    }


    /*
     * Destroy old chart.
     */

    if (
        chartInstances.has(canvas)
    ) {

        try {

            chartInstances
                .get(canvas)
                .destroy();

        } catch(e) {}

    }


    const measurements =
        canvas.chartData;


    const labels =
        measurements.map(
            m => m.name
        );


    const values =
        measurements.map(
            m => m.value
        );


    const lower =
        measurements.map(
            m => m.lower
        );


    /*
     * DAY MODE values are first,
     * NIGHT MODE values second.
     */

    const datasets = [

        {
            label:
                "MTF Value",

            data:
                values,

            borderWidth:
                2,

            pointRadius:
                4,

            tension:
                0.2

        },

        {
            label:
                "LL",

            data:
                lower,

            borderWidth:
                2,

            borderDash:
                [
                    6,
                    4
                ],

            pointRadius:
                0,

            spanGaps:
                true

        }

    ];


    const chart =
        new Chart(
            canvas.getContext("2d"),
            {

                type:
                    "line",


                data: {

                    labels:
                        labels,

                    datasets:
                        datasets

                },


                options: {

                    responsive:
                        true,

                    maintainAspectRatio:
                        false,


                    interaction: {

                        mode:
                            "index",

                        intersect:
                            false

                    },


                    plugins: {

                        legend: {

                            display:
                                true

                        },


                        tooltip: {

                            callbacks: {

                                afterBody:
                                    function(context) {

                                        if (
                                            !context ||
                                            !context.length
                                        ) {

                                            return [];

                                        }


                                        const index =
                                            context[0]
                                                .dataIndex;


                                        const item =
                                            measurements[
                                                index
                                            ];


                                        return [

                                            "Mode: " +
                                            (
                                                item.type === "NIGHT"
                                                    ? "NIGHT MODE"
                                                    : "DAY MODE"
                                            ),

                                            "Result: " +
                                            item.result

                                        ];

                                    }

                            }

                        }

                    },


                    scales: {

                        x: {

                            ticks: {

                                autoSkip:
                                    false,

                                maxRotation:
                                    75,

                                minRotation:
                                    45

                            }

                        },


                        y: {

                            beginAtZero:
                                false

                        }

                    }

                }

            }
        );


    chartInstances.set(
        canvas,
        chart
    );

}


/* ============================================================
   NATURAL ITEM SORT
============================================================ */

function naturalMeasurementCompare(a, b) {

    /*
     * DAY MODE always first.
     */

    const modeA =
        a.type === "NIGHT"
            ? 1
            : 0;


    const modeB =
        b.type === "NIGHT"
            ? 1
            : 0;


    if (
        modeA !== modeB
    ) {

        return modeA - modeB;

    }


    /*
     * Natural text comparison.
     *
     * This makes:
     *
     * 1
     * 2
     * 3
     * ...
     * 9
     *
     * instead of:
     *
     * 1
     * 10
     * 2
     */

    return naturalCompare(
        a.name,
        b.name
    );

}


function naturalCompare(a, b) {

    const aa =
        String(a || "")
            .toLowerCase()
            .match(
                /\d+|\D+/g
            ) || [];


    const bb =
        String(b || "")
            .toLowerCase()
            .match(
                /\d+|\D+/g
            ) || [];


    const length =
        Math.max(
            aa.length,
            bb.length
        );


    for (
        let i = 0;
        i < length;
        i++
    ) {

        if (
            aa[i] === undefined
        ) {

            return -1;
        }


        if (
            bb[i] === undefined
        ) {

            return 1;
        }


        if (
            aa[i] === bb[i]
        ) {

            continue;
        }


        const na =
            Number(aa[i]);


        const nb =
            Number(bb[i]);


        if (
            !Number.isNaN(na) &&
            !Number.isNaN(nb)
        ) {

            return na - nb;

        }


        return aa[i]
            .localeCompare(
                bb[i]
            );

    }


    return 0;
}


/* ============================================================
   EXCLUDED MTF ITEMS
============================================================ */

function isExcludedMTFItem(name) {

    const upper =
        String(name || "")
            .toUpperCase()
            .replace(/\s+/g, "");


    /*
     * Remove:
     *
     * UMA_MTF_1A_VIS_LP-mm
     * UMA_MTF_1A_VIS_Distance
     * UMA_MTF_1B_IR_LP-mm
     * UMA_MTF_1B_IR_Distance
     *
     * Also catches minor naming variations.
     */

    if (
        upper.includes("VIS_LP-MM") ||
        upper.includes("VIS_DISTANCE") ||
        upper.includes("IR_LP-MM") ||
        upper.includes("IR_DISTANCE")
    ) {

        return true;
    }


    return false;
}


/* ============================================================
   MTF TYPE
============================================================ */

function getMTFType(name) {

    const upper =
        String(name || "")
            .toUpperCase();


    /*
     * IR = NIGHT MODE.
     */

    if (
        upper.includes("IR")
    ) {

        return "NIGHT";
    }


    /*
     * Everything else MTF = DAY MODE.
     *
     * This includes:
     *
     * UMA_MTF_1A_1_H
     * UMA_MTF_1A_1_V
     * UMA_MTF_1A_2_H
     * etc.
     */

    return "DAY";
}


/* ============================================================
   NUMBER HELPERS
============================================================ */

function findHeader(
    headers,
    wanted
) {

    if (
        wanted === undefined ||
        wanted === null
    ) {

        return -1;
    }


    const target =
        String(wanted)
            .toLowerCase()
            .replace(
                /[\s_.-]/g,
                ""
            );


    for (
        let i = 0;
        i < headers.length;
        i++
    ) {

        const current =
            String(
                headers[i] || ""
            )
            .toLowerCase()
            .replace(
                /[\s_.-]/g,
                ""
            );


        if (
            current === target
        ) {

            return i;
        }

    }


    return -1;
}


function getFirstExistingValue(
    row,
    indexes
) {

    for (
        const index of indexes
    ) {

        if (
            index !== undefined &&
            index !== null &&
            index >= 0 &&
            row[index] !== undefined &&
            String(
                row[index]
            ).trim() !== ""
        ) {

            return String(
                row[index]
            ).trim();

        }

    }


    return "";
}


function getSpecValue(
    row,
    index
) {

    if (
        !row ||
        index < 0 ||
        index >= row.length
    ) {

        return null;
    }


    return toNumber(
        row[index]
    );
}


function toNumber(value) {

    if (
        value === undefined ||
        value === null
    ) {

        return null;
    }


    const text =
        String(value)
            .trim();


    if (
        text === "" ||
        text === "-" ||
        text.toLowerCase() === "na" ||
        text.toLowerCase() === "n/a"
    ) {

        return null;
    }


    const cleaned =
        text.replace(
            /[^0-9eE+.\-]/g,
            ""
        );


    if (
        cleaned === ""
    ) {

        return null;
    }


    const number =
        Number(cleaned);


    return Number.isFinite(number)
        ? number
        : null;
}


/* ============================================================
   RESULT
============================================================ */

function evaluateResult(
    value,
    lower,
    upper
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "GOOD";
    }


    if (
        lower !== null &&
        lower !== undefined &&
        value < lower
    ) {

        return "NG";
    }


    if (
        upper !== null &&
        upper !== undefined &&
        value > upper
    ) {

        return "NG";
    }


    return "GOOD";
}


/* ============================================================
   SN CLEAN
============================================================ */

function cleanSN(sn) {

    if (
        sn === undefined ||
        sn === null
    ) {

        return "";
    }


    let value =
        String(sn).trim();


    value =
        value.replace(
            /^["']|["']$/g,
            ""
        );


    return value;
}


/* ============================================================
   FORMAT NUMBER
============================================================ */

function formatNumber(value) {

    if (
        value === null ||
        value === undefined ||
        Number.isNaN(value)
    ) {

        return "—";
    }


    return Number(value)
        .toFixed(3)
        .replace(
            /\.?0+$/,
            ""
        );
}


/* ============================================================
   TIME SORT
============================================================ */

function parseTimeValue(time) {

    if (
        !time
    ) {

        return null;
    }


    const parsed =
        Date.parse(
            String(time)
        );


    if (
        Number.isNaN(parsed)
    ) {

        return null;
    }


    return parsed;
}


/* ============================================================
   ERROR
============================================================ */

function showError(message) {

    const box =
        document
            .getElementById(
                "errorBox"
            );


    box.textContent =
        message;


    box.style.display =
        "block";
}


function hideError() {

    const box =
        document
            .getElementById(
                "errorBox"
            );


    box.style.display =
        "none";


    box.textContent =
        "";
}


/* ============================================================
   CLEAR
============================================================ */

function clearAll() {

    document
        .getElementById(
            "logInput"
        )
        .value = "";


    document
        .getElementById(
            "fileInput"
        )
        .value = "";


    document
        .getElementById(
            "fileInfo"
        )
        .textContent = "";


    document
        .getElementById(
            "summaryCard"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "resultsCard"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "resultList"
        )
        .innerHTML =
            "";


    document
        .getElementById(
            "snSearch"
        )
        .value =
            "";


    groupedData = {};

    originalRecords = [];


    chartInstances.forEach(
        function(chart) {

            try {

                chart.destroy();

            } catch(e) {}

        }
    );


    chartInstances.clear();


    currentFilter =
        "ALL";


    setFilter(
        "ALL"
    );


    hideError();

}
