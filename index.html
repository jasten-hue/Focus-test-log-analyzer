<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FOCUS TEST LOG ANALYZER</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #202124;
}

.header {
    background: #1f2937;
    color: white;
    padding: 20px 28px;
}

.header h1 {
    margin: 0 0 5px;
    font-size: 24px;
}

.header p {
    margin: 0;
    opacity: 0.8;
    font-size: 13px;
}

.container {
    max-width: 1500px;
    margin: 20px auto;
    padding: 0 18px;
}

.card {
    background: white;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.input-title {
    font-weight: bold;
    margin-bottom: 10px;
}

textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    padding: 12px;
    border: 1px solid #cfd4da;
    border-radius: 7px;
    font-family: Consolas, monospace;
    font-size: 12px;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
}

button,
.file-label {
    border: 0;
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
}

.analyze-btn {
    background: #2563eb;
    color: white;
}

.clear-btn {
    background: #e5e7eb;
    color: #111827;
}

.file-label {
    background: #059669;
    color: white;
    display: inline-flex;
    align-items: center;
}

#fileInput {
    display: none;
}

/* ============================================================
   SUMMARY
   ============================================================ */

.summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.summary-box {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 15px;
    background: #fafafa;
}

.summary-box .label {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 6px;
}

.summary-box .number {
    font-size: 25px;
    font-weight: bold;
}

.good-number {
    color: #059669;
}

.ng-number {
    color: #dc2626;
}

/* ============================================================
   FILTERS / SEARCH
   ============================================================ */

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.search-box {
    flex: 1;
    min-width: 250px;
}

.search-box input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid #cfd4da;
    border-radius: 7px;
    font-family: Consolas, monospace;
    font-size: 13px;
}

.filter-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.filter-btn {
    background: #e5e7eb;
    color: #374151;
}

.filter-btn.active {
    background: #2563eb;
    color: white;
}

.filter-btn.ng-active {
    background: #dc2626;
    color: white;
}

.filter-btn.good-active {
    background: #059669;
    color: white;
}

/* ============================================================
   RESULT LIST
   ============================================================ */

.result-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.sn-card {
    border: 1px solid #d1d5db;
    border-radius: 9px;
    overflow: hidden;
    background: white;
}

.sn-header {
    display: grid;
    grid-template-columns:
        50px
        minmax(180px, 1fr)
        130px
        minmax(150px, 220px)
        120px;

    align-items: center;
    gap: 12px;
    padding: 13px 15px;
    cursor: pointer;
    background: #fafafa;
}

.sn-header:hover {
    background: #f3f4f6;
}

.sn-number {
    color: #6b7280;
    font-weight: bold;
}

.sn-name {
    font-family: Consolas, monospace;
    font-weight: bold;
    word-break: break-all;
}

.status {
    display: inline-block;
    text-align: center;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.status.good {
    background: #dcfce7;
    color: #166534;
}

.status.ng {
    background: #fee2e2;
    color: #991b1b;
}

.ng-description {
    color: #dc2626;
    font-weight: bold;
    font-size: 13px;
}

.test-count {
    color: #6b7280;
    font-size: 12px;
    text-align: right;
}

.sn-content {
    display: none;
    border-top: 1px solid #e5e7eb;
    padding: 15px;
}

.sn-card.expanded .sn-content {
    display: block;
}

/* ============================================================
   TEST LOG
   ============================================================ */

.test-log {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    margin-bottom: 15px;
    overflow: hidden;
}

.test-header {
    background: #f3f4f6;
    padding: 11px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.test-title {
    font-weight: bold;
}

.test-time {
    font-family: Consolas, monospace;
    color: #6b7280;
    font-size: 12px;
}

.test-body {
    padding: 12px;
}

.section-title {
    margin: 15px 0 8px;
    font-size: 15px;
    font-weight: bold;
    color: #374151;
}

/* ============================================================
   DAY / NIGHT MODE
   ============================================================ */

.mode-title {
    margin-top: 18px;
    margin-bottom: 8px;
    padding: 7px 10px;
    font-size: 14px;
    font-weight: bold;
    border-radius: 5px;
}

.day-mode-title {
    background: #fff7ed;
    color: #c2410c;
}

.night-mode-title {
    background: #eef2ff;
    color: #3730a3;
}

/* ============================================================
   TABLE
   ============================================================ */

.mtf-table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}

th {
    background: #374151;
    color: white;
    text-align: left;
    padding: 9px;
    white-space: nowrap;
}

td {
    padding: 8px 9px;
    border-bottom: 1px solid #e5e7eb;
    white-space: nowrap;
}

tr.pass-row td {
    background: #f9fffb;
}

tr.ng-row td {
    background: #fff1f2;
}

.result-pass {
    color: #15803d;
    font-weight: bold;
}

.result-ng {
    color: #dc2626;
    font-weight: bold;
}

/* ============================================================
   GRAPH
   ============================================================ */

.graph-container {
    width: 100%;
    height: 420px;
    margin-top: 15px;
}

canvas {
    width: 100% !important;
    height: 100% !important;
}

/* ============================================================
   OTHER
   ============================================================ */

.empty {
    padding: 35px;
    text-align: center;
    color: #6b7280;
}

.error {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #fecaca;
    padding: 12px;
    border-radius: 7px;
    margin-bottom: 15px;
    display: none;
}

.format-info {
    margin-top: 8px;
    color: #6b7280;
    font-size: 12px;
}

.no-results {
    padding: 25px;
    text-align: center;
    color: #6b7280;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */

@media (max-width: 900px) {

    .summary-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .sn-header {
        grid-template-columns:
            35px
            1fr
            90px;
    }

    .ng-description,
    .test-count {
        grid-column: 2 / 4;
        text-align: left;
    }
}

@media (max-width: 600px) {

    .summary-grid {
        grid-template-columns: 1fr 1fr;
    }

    .sn-header {
        grid-template-columns:
            30px
            1fr
            70px;
    }

    .controls {
        flex-direction: column;
    }

    .search-box {
        min-width: 100%;
    }
}

</style>
</head>

<body>

<div class="header">

    <h1>FOCUS TEST LOG ANALYZER</h1>

    <p>
        MTF VIS / IR log and SPC data analyzer
    </p>

</div>

<div class="container">

    <!-- =====================================================
         INPUT
         ===================================================== -->

    <div class="card">

        <div class="input-title">
            Paste Log / CSV Data
        </div>

        <textarea
            id="logInput"
            placeholder="Paste your .log or .csv data here..."
        ></textarea>

        <div class="buttons">

            <label class="file-label">

                Browse Data

                <input
                    type="file"
                    id="fileInput"
                    accept=".log,.txt,.csv"
                >

            </label>

            <button
                class="analyze-btn"
                onclick="analyzeLog()"
            >
                Analyze
            </button>

            <button
                class="clear-btn"
                onclick="clearAll()"
            >
                Clear
            </button>

        </div>

        <div
            id="fileInfo"
            class="format-info"
        ></div>

    </div>

    <div
        id="errorBox"
        class="error"
    ></div>


    <!-- =====================================================
         SUMMARY
         ===================================================== -->

    <div
        id="summaryCard"
        class="card"
        style="display:none;"
    >

        <div class="input-title">
            Test Summary
        </div>

        <div class="summary-grid">

            <div class="summary-box">

                <div class="label">
                    Total SN
                </div>

                <div
                    id="totalSN"
                    class="number"
                >
                    0
                </div>

            </div>

            <div class="summary-box">

                <div class="label">
                    GOOD
                </div>

                <div
                    id="goodSN"
                    class="number good-number"
                >
                    0
                </div>

            </div>

            <div class="summary-box">

                <div class="label">
                    NG
                </div>

                <div
                    id="ngSN"
                    class="number ng-number"
                >
                    0
                </div>

            </div>

            <div class="summary-box">

                <div class="label">
                    Test Logs
                </div>

                <div
                    id="totalTests"
                    class="number"
                >
                    0
                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         RESULTS
         ===================================================== -->

    <div
        id="resultsCard"
        class="card"
        style="display:none;"
    >

        <div class="input-title">
            SN Results
        </div>

        <!-- SEARCH + FILTER -->

        <div class="controls">

            <div class="search-box">

                <input
                    type="text"
                    id="snSearch"
                    placeholder="Search SN..."
                    oninput="applyFilters()"
                >

            </div>

            <div class="filter-buttons">

                <button
                    id="filterAll"
                    class="filter-btn active"
                    onclick="setFilter('ALL')"
                >
                    ALL
                </button>

                <button
                    id="filterNG"
                    class="filter-btn"
                    onclick="setFilter('NG')"
                >
                    🔴 NG ONLY
                </button>

                <button
                    id="filterGOOD"
                    class="filter-btn"
                    onclick="setFilter('GOOD')"
                >
                    🟢 GOOD ONLY
                </button>

            </div>

        </div>

        <div
            id="resultList"
            class="result-list"
        ></div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

/* ============================================================
   GLOBAL DATA
   ============================================================ */

let groupedData = {};

let chartInstances = {};

let currentFilter = "ALL";


/* ============================================================
   FILE BROWSER
   ============================================================ */

document
    .getElementById("fileInput")
    .addEventListener(
        "change",
        function(event) {

            const file =
                event.target.files[0];

            if (!file) {
                return;
            }

            const reader =
                new FileReader();

            reader.onload =
                function(e) {

                    document
                        .getElementById(
                            "logInput"
                        )
                        .value =
                            e.target.result;

                    document
                        .getElementById(
                            "fileInfo"
                        )
                        .textContent =
                            "Loaded: " +
                            file.name +
                            " (" +
                            file.size.toLocaleString() +
                            " bytes)";

                };

            reader.onerror =
                function() {

                    showError(
                        "Unable to read the selected file."
                    );

                };

            reader.readAsText(file);

        }
    );


/* ============================================================
   MAIN ANALYZER
   ============================================================ */

function analyzeLog() {

    hideError();

    const raw =
        document
            .getElementById("logInput")
            .value;

    if (!raw.trim()) {

        showError(
            "Please paste a log or browse for a file first."
        );

        return;
    }

    groupedData = {};

    const format =
        detectFormat(raw);

    let records = [];

    if (format === "CSV") {

        records =
            parseCSVData(raw);

    } else {

        records =
            parseOriginalLog(raw);

    }

    /*
     * Automatically try the other parser
     * if nothing was found.
     */

    if (records.length === 0) {

        if (format === "CSV") {

            records =
                parseOriginalLog(raw);

        } else {

            records =
                parseCSVData(raw);

        }

    }

    if (records.length === 0) {

        showError(
            "No MTF data was found. The file was loaded, but its structure could not be recognized."
        );

        return;
    }

    groupRecords(records);

    renderSummary();

    renderResults();

}


/* ============================================================
   FORMAT DETECTION
   ============================================================ */

function detectFormat(text) {

    const lower =
        text.toLowerCase();

    if (
        lower.includes("pcba,") &&
        (
            lower.includes("stamptime") ||
            lower.includes("workno")
        )
    ) {

        return "CSV";
    }

    if (
        lower.includes("item_mtf") ||
        lower.includes("spec: lower")
    ) {

        return "LOG";
    }

    if (
        lower.includes(",") &&
        lower.includes("lower")
    ) {

        return "CSV";
    }

    return "LOG";
}


/* ============================================================
   CSV LINE PARSER
   ============================================================ */

function parseCSVLine(line) {

    const values = [];

    let current = "";

    let inQuotes = false;

    for (
        let i = 0;
        i < line.length;
        i++
    ) {

        const char =
            line[i];

        if (char === '"') {

            if (
                inQuotes &&
                line[i + 1] === '"'
            ) {

                current += '"';

                i++;

            } else {

                inQuotes =
                    !inQuotes;
            }

        } else if (
            char === "," &&
            !inQuotes
        ) {

            values.push(
                current.trim()
            );

            current = "";

        } else {

            current += char;
        }
    }

    values.push(
        current.trim()
    );

    return values;
}


/* ============================================================
   CSV PARSER
   ============================================================ */

function parseCSVData(text) {

    const records = [];

    const lines =
        text
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .split("\n");

    let headerIndex = -1;

    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const lower =
            lines[i].toLowerCase();

        if (
            lower.includes("pcba") &&
            lower.includes("workno") &&
            lower.includes("stamptime")
        ) {

            headerIndex = i;

            break;
        }
    }

    if (headerIndex === -1) {
        return records;
    }

    const headers =
        parseCSVLine(
            lines[headerIndex]
        );

    const specRows = {};

    for (
        let i = headerIndex + 1;
        i < lines.length;
        i++
    ) {

        const row =
            parseCSVLine(
                lines[i]
            );

        if (!row.length) {
            continue;
        }

        const first =
            String(row[0] || "")
                .trim()
                .toLowerCase();

        if (
            [
                "lower",
                "upper",
                "min",
                "max",
                "mean",
                "sigma",
                "cpl",
                "cpu",
                "cplu"
            ].includes(first)
        ) {

            specRows[first] =
                row;
        }
    }

    const measurementColumns = [];

    for (
        let i = 0;
        i < headers.length;
        i++
    ) {

        const header =
            String(
                headers[i] || ""
            ).trim();

        if (
            header
                .toUpperCase()
                .includes("MTF")
        ) {

            measurementColumns.push(i);
        }
    }

    if (
        measurementColumns.length === 0
    ) {

        return records;
    }

    for (
        let rowIndex = headerIndex + 1;
        rowIndex < lines.length;
        rowIndex++
    ) {

        const row =
            parseCSVLine(
                lines[rowIndex]
            );

        if (
            row.length === 0
        ) {
            continue;
        }

        const first =
            String(row[0] || "")
                .trim()
                .toLowerCase();

        if (
            [
                "lower",
                "upper",
                "min",
                "max",
                "mean",
                "sigma",
                "cpl",
                "cpu",
                "cplu"
            ].includes(first)
        ) {

            continue;
        }

        if (
            row.every(
                x =>
                    String(x).trim() === ""
            )
        ) {

            continue;
        }

        const sn =
            getFirstExistingValue(
                row,
                [
                    findHeader(headers, "SN"),
                    findHeader(headers, "SERIAL"),
                    findHeader(headers, "SERIALNUMBER"),
                    findHeader(headers, "PCBA")
                ]
            );

        const workNo =
            getFirstExistingValue(
                row,
                [
                    findHeader(headers, "WORKNO"),
                    findHeader(headers, "WORKNO."),
                    findHeader(headers, "WORK NO")
                ]
            );

        const stampTime =
            getFirstExistingValue(
                row,
                [
                    findHeader(headers, "STAMPTIME"),
                    findHeader(headers, "DATE_TIME"),
                    findHeader(headers, "DATETIME")
                ]
            );

        let hasMeasurement = false;

        const measurements = [];

        for (
            const columnIndex of measurementColumns
        ) {

            const itemName =
                String(
                    headers[columnIndex] || ""
                ).trim();

            /*
             * Ignore unwanted Distance / LP items.
             */
            if (
                isExcludedMTFItem(itemName)
            ) {

                continue;
            }

            const rawValue =
                row[columnIndex];

            const value =
                toNumber(rawValue);

            if (
                value === null
            ) {

                continue;
            }

            hasMeasurement = true;

            const lower =
                getSpecValue(
                    specRows.lower,
                    columnIndex
                );

            const upper =
                getSpecValue(
                    specRows.upper,
                    columnIndex
                );

            measurements.push({

                name: itemName,

                value: value,

                lower: lower,

                upper: upper,

                min:
                    getSpecValue(
                        specRows.min,
                        columnIndex
                    ),

                max:
                    getSpecValue(
                        specRows.max,
                        columnIndex
                    ),

                mean:
                    getSpecValue(
                        specRows.mean,
                        columnIndex
                    ),

                sigma:
                    getSpecValue(
                        specRows.sigma,
                        columnIndex
                    ),

                result:
                    evaluateResult(
                        value,
                        lower,
                        upper
                    ),

                type:
                    getMTFType(itemName)

            });

        }

        if (
            hasMeasurement
        ) {

            measurements.sort(
                sortMTFItems
            );

            records.push({

                sn:
                    cleanSN(sn),

                workNo:
                    workNo || "",

                time:
                    stampTime || "",

                source:
                    "CSV",

                measurements:
                    measurements

            });

        }

    }

    /*
     * Fallback for specification-only CSV.
     */

    if (
        records.length === 0 &&
        specRows.mean
    ) {

        const measurements = [];

        for (
            const columnIndex of measurementColumns
        ) {

            const itemName =
                String(
                    headers[columnIndex] || ""
                ).trim();

            if (
                isExcludedMTFItem(itemName)
            ) {

                continue;
            }

            const value =
                getSpecValue(
                    specRows.mean,
                    columnIndex
                );

            if (
                value === null
            ) {
                continue;
            }

            const lower =
                getSpecValue(
                    specRows.lower,
                    columnIndex
                );

            const upper =
                getSpecValue(
                    specRows.upper,
                    columnIndex
                );

            measurements.push({

                name:
                    itemName,

                value:
                    value,

                lower:
                    lower,

                upper:
                    upper,

                min:
                    getSpecValue(
                        specRows.min,
                        columnIndex
                    ),

                max:
                    getSpecValue(
                        specRows.max,
                        columnIndex
                    ),

                mean:
                    value,

                sigma:
                    getSpecValue(
                        specRows.sigma,
                        columnIndex
                    ),

                result:
                    evaluateResult(
                        value,
                        lower,
                        upper
                    ),

                type:
                    getMTFType(itemName)

            });

        }

        measurements.sort(
            sortMTFItems
        );

        if (
            measurements.length > 0
        ) {

            records.push({

                sn: "",

                workNo: "",

                time: "",

                source: "CSV",

                measurements:
                    measurements

            });

        }

    }

    return records;
}


/* ============================================================
   ORIGINAL LOG PARSER
   ============================================================ */

function parseOriginalLog(text) {

    const records = [];

    const lines =
        text
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .split("\n");

    let currentRecord = null;

    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i];

        /*
         * Detect SN.
         */

        const snMatch =
            line.match(
                /(?:Load SNFile:\s*|SN:\s*)([A-Za-z0-9._-]+)/
            );

        if (snMatch) {

            if (
                currentRecord &&
                currentRecord.measurements.length > 0
            ) {

                currentRecord.measurements.sort(
                    sortMTFItems
                );

                records.push(
                    currentRecord
                );
            }

            currentRecord = {

                sn:
                    cleanSN(
                        snMatch[1]
                    ),

                workNo: "",

                time: "",

                source: "LOG",

                measurements: []

            };

            continue;
        }

        /*
         * Date / Time.
         */

        const dateMatch =
            line.match(
                /Date_Time:\s*(.+)/i
            );

        if (
            dateMatch &&
            currentRecord
        ) {

            currentRecord.time =
                dateMatch[1].trim();

            continue;
        }

        /*
         * Item + Value.
         */

        const itemMatch =
            line.match(
                /Item:\s*([^;]+);\s*Value:\s*([+-]?\d+(?:\.\d+)?)/i
            );

        if (
            itemMatch &&
            currentRecord
        ) {

            const name =
                itemMatch[1].trim();

            /*
             * Remove Distance / LP-mm.
             */

            if (
                isExcludedMTFItem(name)
            ) {

                continue;
            }

            const value =
                Number(
                    itemMatch[2]
                );

            let lower = null;

            let upper = null;

            /*
             * Search specification nearby.
             */

            for (
                let j = i;
                j < Math.min(
                    i + 5,
                    lines.length
                );
                j++
            ) {

                const specMatch =
                    lines[j].match(
                        /SPEC:\s*LOWER=([+-]?\d+(?:\.\d+)?)/i
                    );

                if (
                    specMatch
                ) {

                    lower =
                        Number(
                            specMatch[1]
                        );

                    break;
                }

            }

            const upperMatch =
                lines
                    .slice(
                        i,
                        Math.min(
                            i + 5,
                            lines.length
                        )
                    )
                    .join(" ")
                    .match(
                        /SPEC:\s*(?:LOWER=[^,\]]+,\s*)?UPPER=([+-]?\d+(?:\.\d+)?)/i
                    );

            if (
                upperMatch
            ) {

                upper =
                    Number(
                        upperMatch[1]
                    );
            }

            currentRecord.measurements.push({

                name:
                    name,

                value:
                    value,

                lower:
                    lower,

                upper:
                    upper,

                min: null,

                max: null,

                mean: null,

                sigma: null,

                result:
                    evaluateResult(
                        value,
                        lower,
                        upper
                    ),

                type:
                    getMTFType(name)

            });

        }

    }

    /*
     * Save final record.
     */

    if (
        currentRecord &&
        currentRecord.measurements.length > 0
    ) {

        currentRecord.measurements.sort(
            sortMTFItems
        );

        records.push(
            currentRecord
        );
    }

    /*
     * Fallback when SN markers are missing.
     */

    if (
        records.length === 0
    ) {

        const snMatches =
            [
                ...text.matchAll(
                    /(?:^|\n)\s*SN:\s*([A-Za-z0-9._-]+)/gi
                )
            ];

        const measurements = [];

        for (
            const line of lines
        ) {

            const match =
                line.match(
                    /Item:\s*([^;]+);\s*Value:\s*([+-]?\d+(?:\.\d+)?)/i
                );

            if (!match) {
                continue;
            }

            const name =
                match[1].trim();

            if (
                isExcludedMTFItem(name)
            ) {

                continue;
            }

            const value =
                Number(
                    match[2]
                );

            measurements.push({

                name:
                    name,

                value:
                    value,

                lower:
                    null,

                upper:
                    null,

                min:
                    null,

                max:
                    null,

                mean:
                    null,

                sigma:
                    null,

                result:
                    "GOOD",

                type:
                    getMTFType(name)

            });

        }

        measurements.sort(
            sortMTFItems
        );

        if (
            measurements.length > 0
        ) {

            records.push({

                sn:
                    snMatches.length > 0
                        ? cleanSN(
                            snMatches[0][1]
                          )
                        : "",

                workNo: "",

                time: "",

                source: "LOG",

                measurements:
                    measurements

            });

        }

    }

    return records;
}


/* ============================================================
   GROUP BY SN
   ============================================================ */

function groupRecords(records) {

    groupedData = {};

    records.forEach(
        function(record, index) {

            const sn =
                record.sn &&
                record.sn.trim()
                    ? record.sn.trim()
                    : "NO SN";

            if (
                !groupedData[sn]
            ) {

                groupedData[sn] = {

                    sn:
                        sn,

                    tests:
                        [],

                    overall:
                        "GOOD",

                    ngTypes:
                        new Set(),

                    ngItems:
                        []

                };

            }

            /*
             * Sort all individual MTF items.
             */

            record.measurements.sort(
                sortMTFItems
            );

            /*
             * Store original order so that
             * logs with identical timestamps
             * remain in their input sequence.
             */

            record.originalIndex =
                index;

            groupedData[sn]
                .tests
                .push(record);

            /*
             * Determine overall result.
             */

            record.measurements.forEach(
                function(m) {

                    if (
                        m.result !== "NG"
                    ) {
                        return;
                    }

                    groupedData[sn]
                        .overall =
                            "NG";

                    if (
                        m.type === "VIS"
                    ) {

                        groupedData[sn]
                            .ngTypes
                            .add("DAY MODE NG");

                    } else if (
                        m.type === "IR"
                    ) {

                        groupedData[sn]
                            .ngTypes
                            .add("NIGHT MODE NG");
                    }

                    groupedData[sn]
                        .ngItems
                        .push(m);

                }
            );

        }
    );

    /*
     * Sort test logs by timestamp when available.
     * If timestamps are unavailable or equal,
     * preserve original input order.
     */

    Object.values(
        groupedData
    ).forEach(
        function(snData) {

            snData.tests.sort(
                function(a, b) {

                    const ta =
                        parseDateValue(
                            a.time
                        );

                    const tb =
                        parseDateValue(
                            b.time
                        );

                    if (
                        ta !== null &&
                        tb !== null
                    ) {

                        if (
                            ta !== tb
                        ) {

                            return ta - tb;
                        }
                    }

                    return (
                        a.originalIndex -
                        b.originalIndex
                    );
                }
            );

            snData.tests.forEach(
                function(test, index) {

                    test.testNumber =
                        index + 1;

                }
            );

        }
    );
}


/* ============================================================
   SUMMARY
   ============================================================ */

function renderSummary() {

    const snList =
        Object.values(
            groupedData
        );

    let good = 0;

    let ng = 0;

    let tests = 0;

    snList.forEach(
        function(item) {

            if (
                item.overall === "NG"
            ) {

                ng++;

            } else {

                good++;

            }

            tests +=
                item.tests.length;

        }
    );

    document
        .getElementById("totalSN")
        .textContent =
            snList.length;

    document
        .getElementById("goodSN")
        .textContent =
            good;

    document
        .getElementById("ngSN")
        .textContent =
            ng;

    document
        .getElementById("totalTests")
        .textContent =
            tests;

    document
        .getElementById("summaryCard")
        .style.display =
            "block";
}


/* ============================================================
   FILTER
   ============================================================ */

function setFilter(filter) {

    currentFilter =
        filter;

    const all =
        document.getElementById(
            "filterAll"
        );

    const ng =
        document.getElementById(
            "filterNG"
        );

    const good =
        document.getElementById(
            "filterGOOD"
        );

    all.className =
        "filter-btn";

    ng.className =
        "filter-btn";

    good.className =
        "filter-btn";

    if (
        filter === "ALL"
    ) {

        all.className =
            "filter-btn active";

    } else if (
        filter === "NG"
    ) {

        ng.className =
            "filter-btn ng-active";

    } else if (
        filter === "GOOD"
    ) {

        good.className =
            "filter-btn good-active";
    }

    applyFilters();
}


/* ============================================================
   SEARCH + FILTER
   ============================================================ */

function applyFilters() {

    const search =
        document
            .getElementById(
                "snSearch"
            )
            .value
            .trim()
            .toLowerCase();

    const cards =
        document.querySelectorAll(
            ".sn-card"
        );

    let visibleCount = 0;

    cards.forEach(
        function(card) {

            const sn =
                card.dataset.sn
                    .toLowerCase();

            const status =
                card.dataset.status;

            const matchesSearch =
                !search ||
                sn.includes(search);

            const matchesFilter =
                currentFilter === "ALL" ||
                currentFilter === status;

            if (
                matchesSearch &&
                matchesFilter
            ) {

                card.style.display =
                    "";

                visibleCount++;

            } else {

                card.style.display =
                    "none";
            }

        }
    );

    let empty =
        document.getElementById(
            "filterEmpty"
        );

    if (!empty) {

        empty =
            document.createElement(
                "div"
            );

        empty.id =
            "filterEmpty";

        empty.className =
            "no-results";

        document
            .getElementById(
                "resultList"
            )
            .appendChild(empty);
    }

    if (
        visibleCount === 0
    ) {

        empty.textContent =
            "No SN matches your search/filter.";

        empty.style.display =
            "block";

    } else {

        empty.style.display =
            "none";
    }
}


/* ============================================================
   RESULTS
   ============================================================ */

function renderResults() {

    const container =
        document
            .getElementById(
                "resultList"
            );

    container.innerHTML = "";

    const snList =
        Object.values(
            groupedData
        );

    if (
        snList.length === 0
    ) {

        container.innerHTML =
            '<div class="empty">No results found.</div>';

        return;
    }

    /*
     * Sort SNs naturally.
     */

    snList.sort(
        naturalSNCompare
    );

    snList.forEach(
        function(snData, index) {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "sn-card";

            card.dataset.sn =
                snData.sn;

            card.dataset.status =
                snData.overall;

            /*
             * Header.
             */

            const header =
                document.createElement(
                    "div"
                );

            header.className =
                "sn-header";

            const number =
                document.createElement(
                    "div"
                );

            number.className =
                "sn-number";

            number.textContent =
                index + 1;

            const sn =
                document.createElement(
                    "div"
                );

            sn.className =
                "sn-name";

            sn.textContent =
                snData.sn;

            const status =
                document.createElement(
                    "div"
                );

            status.className =
                "status " +
                (
                    snData.overall === "NG"
                        ? "ng"
                        : "good"
                );

            status.textContent =
                snData.overall;

            const description =
                document.createElement(
                    "div"
                );

            description.className =
                "ng-description";

            /*
             * IMPORTANT:
             *
             * DAY MODE NG has priority.
             *
             * If first/day test is NG,
             * show DAY MODE NG even if
             * another night test is also NG.
             *
             * NIGHT MODE NG is shown only
             * when there is no DAY MODE NG.
             */

            if (
                snData.overall === "NG"
            ) {

                if (
                    snData.ngTypes.has(
                        "DAY MODE NG"
                    )
                ) {

                    description.textContent =
                        "DAY MODE NG";

                } else if (
                    snData.ngTypes.has(
                        "NIGHT MODE NG"
                    )
                ) {

                    description.textContent =
                        "NIGHT MODE NG";

                }

            } else {

                description.textContent =
                    "—";
            }

            const count =
                document.createElement(
                    "div"
                );

            count.className =
                "test-count";

            count.textContent =
                snData.tests.length +
                (
                    snData.tests.length === 1
                        ? " test log"
                        : " test logs"
                );

            header.appendChild(number);

            header.appendChild(sn);

            header.appendChild(status);

            header.appendChild(description);

            header.appendChild(count);


            /*
             * Expanded content.
             */

            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "sn-content";

            /*
             * Every test log remains separate.
             */

            snData.tests.forEach(
                function(test) {

                    content.appendChild(
                        createTestLog(
                            snData,
                            test
                        )
                    );

                }
            );


            /*
             * Expand / collapse.
             */

            header.addEventListener(
                "click",
                function() {

                    card.classList.toggle(
                        "expanded"
                    );

                    if (
                        card.classList.contains(
                            "expanded"
                        )
                    ) {

                        setTimeout(
                            function() {

                                content
                                    .querySelectorAll(
                                        "canvas"
                                    )
                                    .forEach(
                                        function(canvas) {

                                            drawChart(
                                                canvas
                                            );

                                        }
                                    );

                            },
                            50
                        );

                    }

                }
            );


            card.appendChild(header);

            card.appendChild(content);

            container.appendChild(card);

        }
    );

    document
        .getElementById(
            "resultsCard"
        )
        .style.display =
            "block";

    applyFilters();
}


/* ============================================================
   TEST LOG UI
   ============================================================ */

function createTestLog(
    snData,
    test
) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "test-log";

    const header =
        document.createElement(
            "div"
        );

    header.className =
        "test-header";

    const title =
        document.createElement(
            "div"
        );

    title.className =
        "test-title";

    title.textContent =
        "Test Log " +
        test.testNumber;

    const time =
        document.createElement(
            "div"
        );

    time.className =
        "test-time";

    time.textContent =
        test.time ||
        "Time not available";

    header.appendChild(title);

    header.appendChild(time);


    const body =
        document.createElement(
            "div"
        );

    body.className =
        "test-body";


    /*
     * Split into Day / Night.
     */

    const day =
        test.measurements
            .filter(
                m =>
                    m.type === "VIS" ||
                    m.type === "OTHER"
            )
            .filter(
                m =>
                    !isExcludedMTFItem(
                        m.name
                    )
            )
            .sort(
                sortMTFItems
            );

    const night =
        test.measurements
            .filter(
                m =>
                    m.type === "IR"
            )
            .filter(
                m =>
                    !isExcludedMTFItem(
                        m.name
                    )
            )
            .sort(
                sortMTFItems
            );


    /*
     * DAY MODE
     */

    if (
        day.length > 0
    ) {

        body.appendChild(
            createModeSection(
                "DAY MODE",
                day,
                "day"
            )
        );

    }


    /*
     * NIGHT MODE
     */

    if (
        night.length > 0
    ) {

        body.appendChild(
            createModeSection(
                "NIGHT MODE",
                night,
                "night"
            )
        );

    }


    /*
     * Graph.
     */

    const graphMeasurements =
        test.measurements
            .filter(
                m =>
                    !isExcludedMTFItem(
                        m.name
                    )
            )
            .sort(
                sortMTFItems
            );

    if (
        graphMeasurements.length > 0
    ) {

        const chartTitle =
            document.createElement(
                "div"
            );

        chartTitle.className =
            "section-title";

        chartTitle.textContent =
            "MTF Graph";

        body.appendChild(
            chartTitle
        );

        const graph =
            document.createElement(
                "div"
            );

        graph.className =
            "graph-container";

        const canvas =
            document.createElement(
                "canvas"
            );

        canvas.chartData =
            graphMeasurements;

        graph.appendChild(canvas);

        body.appendChild(graph);

    }


    wrapper.appendChild(header);

    wrapper.appendChild(body);

    return wrapper;
}


/* ============================================================
   DAY / NIGHT SECTION
   ============================================================ */

function createModeSection(
    title,
    measurements,
    mode
) {

    const section =
        document.createElement(
            "div"
        );

    const titleElement =
        document.createElement(
            "div"
        );

        );

    );

        )
    );

/* ============================================================
   MEASUREMENT TABLE
   ============================================================ */

function createMeasurementTable(
    measurements
) {

    const tableWrapper =
        document.createElement(
            "div"
        );

    tableWrapper.className =
        "mtf-table-wrapper";

    const table =
        document.createElement(
            "table"
        );

    const thead =
        document.createElement(
            "thead"
        );

    const headerRow =
        document.createElement(
            "tr"
        );

    /*
     * ONLY THESE FOUR COLUMNS.
     */

    [
        "MTF Item",
        "Value",
        "LL",
        "Result"
    ].forEach(
        function(text) {

            const th =
                document.createElement(
                    "th"
                );

            th.textContent =
                text;

            headerRow.appendChild(th);

        }
    );

    thead.appendChild(headerRow);

    const tbody =
        document.createElement(
            "tbody"
        );


    /*
     * Sequential ordering.
     */

    const sorted =
        [...measurements]
            .filter(
                m =>
                    !isExcludedMTFItem(
                        m.name
                    )
            )
            .sort(
                sortMTFItems
            );


    sorted.forEach(
        function(m) {

            const row =
                document.createElement(
                    "tr"
                );

            row.className =
                m.result === "NG"
                    ? "ng-row"
                    : "pass-row";


            const itemCell =
                document.createElement(
                    "td"
                );

            itemCell.textContent =
                m.name;


            const valueCell =
                document.createElement(
                    "td"
                );

            valueCell.textContent =
                formatNumber(
                    m.value
                );


            const llCell =
                document.createElement(
                    "td"
                );

            llCell.textContent =
                formatNumber(
                    m.lower
                );


            const resultCell =
                document.createElement(
                    "td"
                );

            resultCell.textContent =
                m.result;

            resultCell.className =
                m.result === "NG"
                    ? "result-ng"
                    : "result-pass";


            row.appendChild(itemCell);

            row.appendChild(valueCell);

            row.appendChild(llCell);

            row.appendChild(resultCell);

            tbody.appendChild(row);

        }
    );


    table.appendChild(thead);

    table.appendChild(tbody);

    tableWrapper.appendChild(table);

    return tableWrapper;
}


/* ============================================================
   GRAPH
   ============================================================ */

function drawChart(canvas) {

    if (
        !canvas ||
        !canvas.chartData
    ) {

        return;
    }

    if (
        chartInstances[canvas]
    ) {

        chartInstances[canvas].destroy();

    }


    /*
     * Remove unwanted items
     * and sort sequentially.
     */

    const measurements =
        canvas.chartData
            .filter(
                m =>
                    !isExcludedMTFItem(
                        m.name
                    )
            )
            .sort(
                sortMTFItems
            );


    const labels =
        measurements.map(
            m => m.name
        );

    const values =
        measurements.map(
            m => m.value
        );

    const lower =
        measurements.map(
            m => m.lower
        );


    const datasets = [

        {
            label: "MTF Value",

            data: values,

            borderWidth: 2,

            pointRadius: 4,

            tension: 0.2
        },

        {
            label: "LL",

            data: lower,

            borderWidth: 2,

            borderDash: [
                6,
                4
            ],

            pointRadius: 0,

            spanGaps: true
        }

    ];


    chartInstances[canvas] =
        new Chart(
            canvas.getContext("2d"),
            {

                type: "line",

                data: {

                    labels:
                        labels,

                    datasets:
                        datasets

                },

                options: {

                    responsive:
                        true,

                    maintainAspectRatio:
                        false,

                    interaction: {

                        mode:
                            "index",

                        intersect:
                            false
                    },

                    plugins: {

                        legend: {

                            display:
                                true
                        },

                        tooltip: {

                            callbacks: {

                                afterBody:
                                    function(
                                        context
                                    ) {

                                        if (
                                            !context ||
                                            !context.length
                                        ) {

                                            return [];
                                        }

                                        const index =
                                            context[0]
                                                .dataIndex;

                                        const item =
                                            measurements[
                                                index
                                            ];

                                        return [

                                            "Result: " +
                                            item.result,

                                            "Mode: " +
                                            (
                                                item.type === "IR"
                                                    ? "NIGHT MODE"
                                                    : "DAY MODE"
                                            )

                                        ];

                                    }

                            }

                        }

                    },

                    scales: {

                        x: {

                            ticks: {

                                autoSkip:
                                    false,

                                maxRotation:
                                    75,

                                minRotation:
                                    45

                            }

                        },

                        y: {

                            beginAtZero:
                                false

                        }

                    }

                }

            }
        );

}


/* ============================================================
   SORT MTF ITEMS
   ============================================================ */

function sortMTFItems(a, b) {

    const nameA =
        String(
            a.name || a
        );

    const nameB =
        String(
            b.name || b
        );


    function extract(name) {

        /*
         * Examples:
         *
         * UMA_MTF_1A_1_H
         * UMA_MTF_1A_1_V
         * UMA_MTF_1B_IR_1_H
         * UMA_MTF_1B_IR_1_V
         */

        const match =
            name.match(
                /(?:MTF_[^_]+_(?:IR_)?)(\d+)_([HV])/i
            );

        if (match) {

            return {

                number:
                    Number(
                        match[1]
                    ),

                direction:
                    match[2]
                        .toUpperCase()

            };

        }


        /*
         * Fallback.
         */

        const fallback =
            name.match(
                /_(\d+)_([HV])(?:_|$)/i
            );

        if (fallback) {

            return {

                number:
                    Number(
                        fallback[1]
                    ),

                direction:
                    fallback[2]
                        .toUpperCase()

            };

        }


        return {

            number:
                999999,

            direction:
                ""

        };

    }


    const A =
        extract(nameA);

    const B =
        extract(nameB);


    if (
        A.number !== B.number
    ) {

        return (
            A.number -
            B.number
        );

    }


    /*
     * H before V.
     */

    if (
        A.direction === "H" &&
        B.direction === "V"
    ) {

        return -1;
    }

    if (
        A.direction === "V" &&
        B.direction === "H"
    ) {

        return 1;
    }


    return nameA.localeCompare(
        nameB
    );
}


/* ============================================================
   EXCLUDED MTF ITEMS
   ============================================================ */

function isExcludedMTFItem(name) {

    const upper =
        String(
            name || ""
        )
        .trim()
        .toUpperCase();


    /*
     * These are intentionally removed
     * from:
     *
     * - tables
     * - Day/Night data
     * - graph
     */

    if (
        upper.includes("VIS_LP-MM") ||
        upper.includes("VIS_LP_MM") ||
        upper.includes("VIS_DISTANCE") ||
        upper.includes("IR_DISTANCE") ||
        upper.includes("IR-LP-MM") ||
        upper.includes("IR_LP-MM") ||
        upper.includes("IR_LP_MM")
    ) {

        return true;
    }


    /*
     * Catch variants where spacing differs.
     */

    if (
        upper.includes("DISTANCE") ||
        upper.includes("LP-MM") ||
        upper.includes("LP_MM")
    ) {

        return true;
    }


    return false;
}


/* ============================================================
   MTF TYPE
   ============================================================ */

function getMTFType(name) {

    const upper =
        String(
            name || ""
        )
        .toUpperCase();


    /*
     * IR has priority for actual
     * night mode items.
     */

    if (
        upper.includes("_IR_") ||
        upper.includes("IR_")
    ) {

        return "IR";
    }


    /*
     * VIS = Day Mode.
     */

    if (
        upper.includes("VIS")
    ) {

        return "VIS";
    }


    /*
     * Other MTF is treated as Day Mode.
     */

    return "OTHER";
}


/* ============================================================
   DATE PARSER
   ============================================================ */

function parseDateValue(value) {

    if (
        !value
    ) {

        return null;
    }

    const parsed =
        Date.parse(
            String(value)
        );

    if (
        Number.isNaN(parsed)
    ) {

        return null;
    }

    return parsed;
}


/* ============================================================
   NATURAL SN SORT
   ============================================================ */

function naturalSNCompare(a, b) {

    return String(a.sn || "")
        .localeCompare(
            String(b.sn || ""),
            undefined,
            {
                numeric: true,
                sensitivity: "base"
            }
        );
}


/* ============================================================
   HEADER FINDER
   ============================================================ */

function findHeader(
    headers,
    wanted
) {

    if (
        wanted === undefined ||
        wanted === null
    ) {

        return -1;
    }

    const target =
        String(wanted)
            .toLowerCase()
            .replace(
                /[\s_.-]/g,
                ""
            );


    for (
        let i = 0;
        i < headers.length;
        i++
    ) {

        const current =
            String(
                headers[i] || ""
            )
            .toLowerCase()
            .replace(
                /[\s_.-]/g,
                ""
            );


        if (
            current === target
        ) {

            return i;
        }

    }


    return -1;
}


/* ============================================================
   GET FIRST VALUE
   ============================================================ */

function getFirstExistingValue(
    row,
    indexes
) {

    for (
        const index of indexes
    ) {

        if (
            index !== undefined &&
            index !== null &&
            index >= 0 &&
            row[index] !== undefined &&
            String(
                row[index]
            ).trim() !== ""
        ) {

            return String(
                row[index]
            ).trim();

        }

    }

    return "";
}


/* ============================================================
   SPEC VALUE
   ============================================================ */

function getSpecValue(
    row,
    index
) {

    if (
        !row ||
        index < 0 ||
        index >= row.length
    ) {

        return null;
    }

    return toNumber(
        row[index]
    );
}


/* ============================================================
   NUMBER
   ============================================================ */

function toNumber(value) {

    if (
        value === undefined ||
        value === null
    ) {

        return null;
    }

    const text =
        String(value)
            .trim();


    if (
        text === "" ||
        text === "-" ||
        text.toLowerCase() === "na" ||
        text.toLowerCase() === "n/a"
    ) {

        return null;
    }


    const cleaned =
        text.replace(
            /[^0-9eE+.\-]/g,
            ""
        );


    if (
        cleaned === ""
    ) {

        return null;
    }


    const number =
        Number(cleaned);


    return Number.isFinite(number)
        ? number
        : null;
}


/* ============================================================
   RESULT
   ============================================================ */

function evaluateResult(
    value,
    lower,
    upper
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "GOOD";
    }


    if (
        lower !== null &&
        lower !== undefined &&
        value < lower
    ) {

        return "NG";
    }


    if (
        upper !== null &&
        upper !== undefined &&
        value > upper
    ) {

        return "NG";
    }


    return "GOOD";
}


/* ============================================================
   CLEAN SN
   ============================================================ */

function cleanSN(sn) {

    if (
        sn === undefined ||
        sn === null
    ) {

        return "";
    }


    let value =
        String(sn).trim();


    value =
        value.replace(
            /^["']|["']$/g,
            ""
        );


    if (
        value === ""
    ) {

        return "";
    }


    return value;
}


/* ============================================================
   FORMAT NUMBER
   ============================================================ */

function formatNumber(value) {

    if (
        value === null ||
        value === undefined ||
        Number.isNaN(value)
    ) {

        return "—";
    }


    return Number(value)
        .toFixed(3)
        .replace(
            /\.?0+$/,
            ""
        );
}


/* ============================================================
   ERROR
   ============================================================ */

function showError(message) {

    const box =
        document
            .getElementById(
                "errorBox"
            );

    box.textContent =
        message;

    box.style.display =
        "block";
}


function hideError() {

    const box =
        document
            .getElementById(
                "errorBox"
            );

    box.style.display =
        "none";

    box.textContent =
        "";
}


/* ============================================================
   CLEAR
   ============================================================ */

function clearAll() {

    document
        .getElementById(
            "logInput"
        )
        .value = "";


    document
        .getElementById(
            "fileInput"
        )
        .value = "";


    document
        .getElementById(
            "fileInfo"
        )
        .textContent = "";


    document
        .getElementById(
            "snSearch"
        )
        .value = "";


    document
        .getElementById(
            "summaryCard"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "resultsCard"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "resultList"
        )
        .innerHTML = "";


    groupedData = {};


    Object.values(
        chartInstances
    ).forEach(
        function(chart) {

            try {

                chart.destroy();

            } catch(e) {}

        }
    );


    chartInstances = {};

    currentFilter =
        "ALL";


    document
        .getElementById(
            "filterAll"
        )
        .className =
            "filter-btn active";


    document
        .getElementById(
            "filterNG"
        )
        .className =
            "filter-btn";


    document
        .getElementById(
            "filterGOOD"
        )
        .className =
            "filter-btn";


    hideError();
}
