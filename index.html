function clearAll() {

    document
        .getElementById("logInput")
        .value = "";

    document
        .getElementById("fileInput")
        .value = "";

    document
        .getElementById("fileInfo")
        .textContent = "";

    document
        .getElementById("summaryCard")
        .style.display = "none";

    document
        .getElementById("stationGraphCard")
        .style.display = "none";

    document
        .getElementById("collimatorGraphsContainer")
        .innerHTML = "";

    const fixtureDotContainer =
        document.getElementById(
            "fixtureDotGraphsContainer"
        );

    if (fixtureDotContainer) {
        fixtureDotContainer.innerHTML = "";
    }

    document
        .getElementById("resultsCard")
        .style.display = "none";

    document
        .getElementById("resultList")
        .innerHTML = "";

    document
        .getElementById("snSearch")
        .value = "";

    groupedData = {};

    originalRecords = [];

    stationNGData = {};

    collimatorNGDataByFixture = {};


    /* ========================================================
       DESTROY INDIVIDUAL SN CHARTS
    ======================================================== */

    chartInstances.forEach(
        function(chart) {

            try {

                chart.destroy();

            } catch (e) {}

        }
    );

    chartInstances.clear();


    /* ========================================================
       DESTROY STATION GRAPH
    ======================================================== */

    if (stationChartInstance) {

        try {

            stationChartInstance.destroy();

        } catch (e) {}

        stationChartInstance = null;

    }


    /* ========================================================
       DESTROY COLLIMATOR GRAPHS
    ======================================================== */

    collimatorChartInstances.forEach(
        function(chart) {

            try {

                chart.destroy();

            } catch (e) {}

        }
    );

    collimatorChartInstances.clear();


    /* ========================================================
       DESTROY FIXTURE DOT GRAPHS
    ======================================================== */

    fixtureDotChartInstances.forEach(
        function(chart) {

            try {
                chart.destroy();
            } catch (e) {}

        }
    );

    fixtureDotChartInstances.clear();


    /* ========================================================
       RESET FILTER
    ======================================================== */

    currentFilter = "ALL";


    document
        .getElementById("filterAll")
        .classList.add("active");

    document
        .getElementById("filterNG")
        .classList.remove("active");

    document
        .getElementById("filterGOOD")
        .classList.remove("active");


    hideError();

}


/* ============================================================
   COLLAPSIBLE GRAPH UI
   All chart areas start collapsed to keep the frontend compact.
============================================================ */
(function setupCollapsibleGraphGroups() {

    function createGroupToggle(container, title) {
        if (!container || container.dataset.groupToggleReady === "1") return;

        container.dataset.groupToggleReady = "1";
        container.classList.add("graph-collapsed");

        const button = document.createElement("button");
        button.type = "button";
        button.className = "graph-toggle-btn";
        button.setAttribute("aria-expanded", "false");

        const label = document.createElement("span");
        label.textContent = "Expand " + title;

        const icon = document.createElement("span");
        icon.className = "graph-toggle-icon";
        icon.textContent = "▶";

        button.appendChild(label);
        button.appendChild(icon);
        container.parentNode.insertBefore(button, container);

        button.addEventListener("click", function() {
            const isCollapsed = container.classList.contains("graph-collapsed");
            container.classList.toggle("graph-collapsed", !isCollapsed);
            button.classList.toggle("expanded", isCollapsed);
            button.setAttribute("aria-expanded", isCollapsed ? "true" : "false");
            label.textContent = (isCollapsed ? "Collapse " : "Expand ") + title;

            if (isCollapsed) {
                setTimeout(function() {
                    window.dispatchEvent(new Event("resize"));
                }, 50);
            }
        });
    }

    function setupStationGroup() {
        const card = document.getElementById("stationGraphCard");
        if (!card || card.dataset.stationGroupReady === "1") return;

        card.dataset.stationGroupReady = "1";
        const graph = card.querySelector(".summary-graph-container");
        if (!graph) return;

        graph.classList.add("graph-collapsed");

        const button = document.createElement("button");
        button.type = "button";
        button.className = "graph-toggle-btn";
        button.innerHTML = '<span>Expand Station NG graph</span><span class="graph-toggle-icon">▶</span>';
        graph.parentNode.insertBefore(button, graph);

        button.addEventListener("click", function() {
            const collapsed = graph.classList.contains("graph-collapsed");
            graph.classList.toggle("graph-collapsed", !collapsed);
            button.classList.toggle("expanded", collapsed);
            button.querySelector("span").textContent = collapsed ? "Collapse Station NG graph" : "Expand Station NG graph";
            if (collapsed) setTimeout(() => window.dispatchEvent(new Event("resize")), 50);
        });
    }

    function setup() {
        setupStationGroup();
        createGroupToggle(document.getElementById("collimatorGraphsContainer"), "Accumulated NG fixture graphs");
        createGroupToggle(document.getElementById("fixtureDotGraphsContainer"), "Fixture correlation graphs");
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", setup);
    } else {
        setup();
    }
})();

</script>
