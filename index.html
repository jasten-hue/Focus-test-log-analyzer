<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FOCUS TEST LOG ANALYZER</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #202124;
}

.header {
    background: #1f2937;
    color: white;
    padding: 20px 28px;
}

.header h1 {
    margin: 0 0 5px;
    font-size: 24px;
}

.header p {
    margin: 0;
    opacity: 0.8;
    font-size: 13px;
}

.container {
    max-width: 1500px;
    margin: 20px auto;
    padding: 0 18px;
}

.card {
    background: white;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.input-title {
    font-weight: bold;
    margin-bottom: 10px;
}

textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    padding: 12px;
    border: 1px solid #cfd4da;
    border-radius: 7px;
    font-family: Consolas, monospace;
    font-size: 12px;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
}

button,
.file-label {
    border: 0;
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
}

.analyze-btn {
    background: #2563eb;
    color: white;
}

.clear-btn {
    background: #e5e7eb;
    color: #111827;
}

.file-label {
    background: #059669;
    color: white;
    display: inline-flex;
    align-items: center;
}

#fileInput {
    display: none;
}

.summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.summary-box {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 15px;
    background: #fafafa;
}

.summary-box .label {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 6px;
}

.summary-box .number {
    font-size: 25px;
    font-weight: bold;
}

.good-number {
    color: #059669;
}

.ng-number {
    color: #dc2626;
}


/* ============================================================
   SEARCH + FILTER
============================================================ */

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.search-box {
    flex: 1;
    min-width: 250px;
    padding: 11px 13px;
    border: 1px solid #cfd4da;
    border-radius: 7px;
    font-family: Arial, Helvetica, sans-serif;

}

.filter-btn {
    background: #e5e7eb;
    color: #374151;
}

.filter-btn.active {

}

.filter-btn.ng-filter.active {

}

.filter-btn.good-filter.active {

/* ============================================================
   RESULT LIST
============================================================ */

.result-list {
    display: flex;
    flex-direction: column;

}

.sn-card {
    border: 1px solid #d1d5db;
    border-radius: 9px;
    overflow: hidden;

}

.sn-header {
    display: grid;
    grid-template-columns:
        50px
        minmax(180px, 1fr)
        110px
        180px
        110px;

    align-items: center;
    gap: 12px;
    padding: 13px 15px;
    cursor: pointer;
    background: #fafafa;
}

.sn-header:hover {

}

}

.sn-name {

}

.status {

}

.sn-content {

    border-top: 1px solid #e5e7eb;
    padding: 15px;
}

   TEST LOG
============================================================ */

.test-log {

    border-radius: 8px;
    margin-bottom: 15px;
    overflow: hidden;
}

.test-header {

    padding: 11px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;

.test-title {

.test-time {
    font-family: Consolas, monospace;

.test-body {

}

.section-title {

    font-weight: bold;

}

.mode-title {

/* ============================================================

============================================================ */

canvas {

.summary-graph-card {

/* ============================================================
   RESPONSIVE
============================================================ */

@media (max-width: 900px) {

    .summary-grid {

    }

    }

    }

<body>

<div class="header">

    <h1>FOCUS TEST LOG ANALYZER</h1>

    <p>
        MTF VIS / IR log and SPC data analyzer
    </p>

</div>


<div class="container">


<!-- ============================================================
     INPUT
============================================================ -->

<div class="card">

    <div class="input-title">

    ></div>

============================================================ -->

<div

     SUMMARY
============================================================ -->

<div
    id="summaryCard"
    class="card"

>

    <div class="input-title">

                id="goodSN"

            </div>

                id="ngSN"

            </div>

<script src="chart.umd.min.js"></script>


<script>


/* ============================================================
   GLOBAL DATA
============================================================ */

let groupedData = {};

let chartInstances = new Map();

let currentFilter = "ALL";

let originalRecords = [];

let stationNGData = {};

let collimatorNGDataByFixture = {};

let stationChartInstance = null;

let collimatorChartInstances = new Map();


/* ============================================================
   FILE BROWSER
============================================================ */

document
    .getElementById("fileInput")
    .addEventListener(
        "change",
        function(event) {

            const file =
                event.target.files[0];

            if (!file) {
                return;
            }

            const reader =
                new FileReader();

            reader.onload =
                function(e) {

                    document
                        .getElementById("logInput")
                        .value =
                            e.target.result;

                    document
                        .getElementById("fileInfo")
                        .textContent =
                            "Loaded: " +
                            file.name +
                            " (" +
                            file.size.toLocaleString() +
                            " bytes)";

                };

            reader.onerror =
                function() {

                    showError(
                        "Unable to read the selected file."
                    );

                };

            reader.readAsText(file);

        }
    );


/* ============================================================
   MAIN ANALYZER
============================================================ */

function analyzeLog() {

    hideError();

    const raw =
        document
            .getElementById("logInput")
            .value;

    if (!raw.trim()) {

        showError(
            "Please paste a log or browse for a file first."
        );

        return;
    }


    groupedData = {};

    originalRecords = [];

    stationNGData = {};

    collimatorNGDataByFixture = {};


    const format =
        detectFormat(raw);


    let records = [];


    if (format === "CSV") {

        records =
            parseCSVData(raw);

    } else {

        records =
            parseOriginalLog(raw);

    }


    /*
     * Automatic fallback.
     */

    if (records.length === 0) {

        if (format === "CSV") {

            records =
                parseOriginalLog(raw);

        } else {

            records =
                parseCSVData(raw);

        }

    }


    if (records.length === 0) {

        showError(
            "No MTF data was found. The file was loaded, but its structure could not be recognized."
        );

        return;
    }


    /*
     * Preserve every valid record.
     */

    originalRecords =
        records.map(
            (record, index) => {

                record.originalIndex =
                    index;

                return record;

            }
        );


    groupRecords(
        originalRecords
    );


    buildNGSummaryData(
        originalRecords
    );


    renderSummary();

    renderSummaryGraphs();

    renderResults();

}


/* ============================================================
   FORMAT DETECTION
============================================================ */

function detectFormat(text) {

    const lower =
        text.toLowerCase();


    if (
        lower.includes("pcba,") &&
        (
            lower.includes("stamptime") ||
            lower.includes("workno")
        )
    ) {

        return "CSV";
    }


    if (
        lower.includes("item_mtf") ||
        lower.includes("spec: lower")
    ) {

        return "LOG";
    }


    if (
        lower.includes(",") &&
        lower.includes("lower")
    ) {

        return "CSV";
    }


    return "LOG";
}


/* ============================================================
   CSV LINE PARSER
============================================================ */

function parseCSVLine(line) {

    const values = [];

    let current = "";

    let inQuotes = false;


    for (
        let i = 0;
        i < line.length;
        i++
    ) {

        const char =
            line[i];


        if (char === '"') {

            if (
                inQuotes &&
                line[i + 1] === '"'
            ) {

                current += '"';

                i++;

            } else {

                inQuotes =
                    !inQuotes;

            }

        } else if (
            char === "," &&
            !inQuotes
        ) {

            values.push(
                current.trim()
            );

            current = "";

        } else {

            current += char;

        }

    }


    values.push(
        current.trim()
    );


    return values;
}


/* ============================================================
   CSV PARSER
============================================================ */

function parseCSVData(text) {

    const records = [];


    const lines =
        text
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .split("\n");


    let headerIndex = -1;


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const lower =
            lines[i].toLowerCase();


        if (
            lower.includes("pcba") &&
            lower.includes("workno") &&
            lower.includes("stamptime")
        ) {

            headerIndex = i;

            break;
        }

    }


    if (headerIndex === -1) {

        return records;
    }


    const headers =
        parseCSVLine(
            lines[headerIndex]
        );


    const specRows = {};


    for (
        let i = headerIndex + 1;
        i < lines.length;
        i++
    ) {

        const row =
            parseCSVLine(
                lines[i]
            );


        if (!row.length) {
            continue;
        }


        const first =
            String(row[0] || "")
                .trim()
                .toLowerCase();


        if (
            [
                "lower",
                "upper",
                "min",
                "max",
                "mean",
                "sigma",
                "cpl",
                "cpu",
                "cplu"
            ].includes(first)
        ) {

            specRows[first] =
                row;

        }

    }


    /*
     * Find all MTF columns.
     */

    const measurementColumns = [];


    for (
        let i = 0;
        i < headers.length;
        i++
    ) {

        const header =
            String(
                headers[i] || ""
            ).trim();


        /*
         * NEVER collect a blank header.
         */

        if (!header) {
            continue;
        }


        if (
            header
                .toUpperCase()
                .includes("MTF")
        ) {

            if (
                isExcludedMTFItem(
                    header
                )
            ) {

                continue;
            }


            measurementColumns.push(i);

        }

    }


    if (
        measurementColumns.length === 0
    ) {

        return records;
    }


    /*
     * Find Station IP header.
     */

    const stationIPIndex =
        findStationIPHeader(
            headers
        );


    /*
     * Read every actual data row.
     */

    for (
        let rowIndex = headerIndex + 1;
        rowIndex < lines.length;
        rowIndex++
    ) {

        const row =
            parseCSVLine(
                lines[rowIndex]
            );


        if (!row.length) {
            continue;
        }


        const first =
            String(row[0] || "")
                .trim()
                .toLowerCase();


        if (
            [
                "lower",
                "upper",
                "min",
                "max",
                "mean",
                "sigma",
                "cpl",
                "cpu",
                "cplu"
            ].includes(first)
        ) {

            continue;
        }


        /*
         * Ignore completely empty rows.
         */

        if (
            row.every(
                x =>
                    String(x ?? "").trim() === ""
            )
        ) {

            continue;
        }


        const sn =
            getFirstExistingValue(
                row,
                [
                    findHeader(
                        headers,
                        "SN"
                    ),

                    findHeader(
                        headers,
                        "SERIAL"
                    ),

                    findHeader(
                        headers,
                        "SERIALNUMBER"
                    ),

                    findHeader(
                        headers,
                        "PCBA"
                    )
                ]
            );


        const workNo =
            getFirstExistingValue(
                row,
                [
                    findHeader(
                        headers,
                        "WORKNO"
                    ),

                    findHeader(
                        headers,
                        "WORKNO."
                    ),

                    findHeader(
                        headers,
                        "WORK NO"
                    )
                ]
            );


        const stampTime =
            getFirstExistingValue(
                row,
                [
                    findHeader(
                        headers,
                        "STAMPTIME"
                    ),

                    findHeader(
                        headers,
                        "DATE_TIME"
                    ),

                    findHeader(
                        headers,
                        "DATETIME"
                    )
                ]
            );


        /*
         * Station IP.
         *
         * Blank remains blank here.
         * UNKNOWN is assigned later only when
         * building the graph.
         */

        const stationIP =
            stationIPIndex >= 0
                ? String(
                    row[stationIPIndex] ?? ""
                  ).trim()
                : "";


        const measurements = [];


        for (
            const columnIndex
            of measurementColumns
        ) {

            const itemName =
                String(
                    headers[columnIndex] ?? ""
                ).trim();


            /*
             * Do not create a measurement if
             * the header itself is blank.
             */

            if (!itemName) {
                continue;
            }


            const rawValue =
                row[columnIndex];


            /*
             * ====================================================
             * IMPORTANT:
             *
             * BLANK / EMPTY CELLS ARE COMPLETELY IGNORED.
             * ====================================================
             */

            if (
                rawValue === undefined ||
                rawValue === null ||
                String(rawValue).trim() === ""
            ) {

                continue;

            }


            /*
             * Convert value to number.
             */

            const value =
                toNumber(
                    rawValue
                );


            /*
             * Invalid values are also ignored.
             *
             * Examples:
             * -
             * NA
             * N/A
             * abc
             */

            if (
                value === null
            ) {

                continue;

            }


            const lower =
                getSpecValue(
                    specRows.lower,
                    columnIndex
                );


            const upper =
                getSpecValue(
                    specRows.upper,
                    columnIndex
                );


            const result =
                evaluateResult(
                    value,
                    lower,
                    upper
                );


            measurements.push({

                name:
                    itemName,

                value:
                    value,

                lower:
                    lower,

                upper:
                    upper,

                result:
                    result,

                type:
                    getMTFType(
                        itemName
                    )

            });

        }


        /*
         * IMPORTANT:
         *
         * If the row has no valid measurements,
         * do NOT create a test record.
         */

        if (
            measurements.length > 0
        ) {

            records.push({

                sn:
                    cleanSN(sn),

                workNo:
                    workNo || "",

                time:
                    stampTime || "",

                stationIP:
                    stationIP,

                source:
                    "CSV",

                measurements:
                    measurements

            });

        }

    }


    return records;
}


/* ============================================================
   ORIGINAL LOG PARSER
============================================================ */

function parseOriginalLog(text) {

    const records = [];


    const lines =
        text
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .split("\n");


    let currentRecord = null;


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i];


        /*
         * Detect SN.
         */

        const snMatch =
            line.match(
                /(?:Load SNFile:\s*|SN:\s*)([A-Za-z0-9._-]+)/
            );


        if (snMatch) {

            if (
                currentRecord &&
                currentRecord.measurements.length > 0
            ) {

                records.push(
                    currentRecord
                );

            }


            currentRecord = {

                sn:
                    cleanSN(
                        snMatch[1]
                    ),

                workNo:
                    "",

                time:
                    "",

                stationIP:
                    "",

                source:
                    "LOG",

                measurements:
                    []

            };


            continue;
        }


        /*
         * Date / Time.
         */

        const dateMatch =
            line.match(
                /Date_Time:\s*(.+)/i
            );


        if (
            dateMatch &&
            currentRecord
        ) {

            const timeValue =
                String(
                    dateMatch[1] || ""
                ).trim();


            if (timeValue) {

                currentRecord.time =
                    timeValue;

            }


            continue;
        }


        /*
         * Station IP.
         */

        const stationMatch =
            line.match(
                /(?:Station\s*IP|StationIP|STATION_IP|IP)\s*[:=]\s*([0-9a-fA-F:.]+)/i
            );


        if (
            stationMatch &&
            currentRecord
        ) {

            const station =
                String(
                    stationMatch[1] || ""
                ).trim();


            if (station) {

                currentRecord.stationIP =
                    station;

            }


            continue;
        }


        /*
         * MTF item.
         */

        const itemMatch =
            line.match(
                /Item:\s*([^;]+);\s*Value:\s*([+-]?\d+(?:\.\d+)?)/i
            );


        if (
            itemMatch &&
            currentRecord
        ) {

            const name =
                String(
                    itemMatch[1] || ""
                ).trim();


            /*
             * Blank item name = ignore.
             */

            if (!name) {
                continue;
            }


            /*
             * Ignore excluded MTF items.
             */

            if (
                isExcludedMTFItem(
                    name
                )
            ) {

                continue;
            }


            const value =
                toNumber(
                    itemMatch[2]
                );


            /*
             * Invalid value = ignore.
             */

            if (
                value === null
            ) {

                continue;
            }


            let lower = null;

            let upper = null;


            /*
             * Search nearby specification.
             */

            for (
                let j = i;
                j < Math.min(
                    i + 5,
                    lines.length
                );
                j++
            ) {

                const lowerMatch =
                    lines[j].match(
                        /SPEC:\s*LOWER\s*=\s*([+-]?\d+(?:\.\d+)?)/i
                    );


                if (
                    lowerMatch
                ) {

                    lower =
                        toNumber(
                            lowerMatch[1]
                        );

                    break;
                }

            }


            /*
             * Search for upper if available.
             */

            for (
                let j = i;
                j < Math.min(
                    i + 5,
                    lines.length
                );
                j++
            ) {

                const upperMatch =
                    lines[j].match(
                        /SPEC:\s*UPPER\s*=\s*([+-]?\d+(?:\.\d+)?)/i
                    );


                if (
                    upperMatch
                ) {

                    upper =
                        toNumber(
                            upperMatch[1]
                        );

                    break;
                }

            }


            const result =
                evaluateResult(
                    value,
                    lower,
                    upper
                );


            currentRecord
                .measurements
                .push({

                    name:
                        name,

                    value:
                        value,

                    lower:
                        lower,

                    upper:
                        upper,

                    result:
                        result,

                    type:
                        getMTFType(
                            name
                        )

                });

        }

    }


    /*
     * Save final record.
     */

    if (
        currentRecord &&
        currentRecord.measurements.length > 0
    ) {

        records.push(
            currentRecord
        );

    }


    /*
     * Fallback.
     */

    if (
        records.length === 0
    ) {

        const measurements = [];


        for (
            const line of lines
        ) {

            const match =
                line.match(
                    /Item:\s*([^;]+);\s*Value:\s*([+-]?\d+(?:\.\d+)?)/i
                );


            if (!match) {
                continue;
            }


            const name =
                String(
                    match[1] || ""
                ).trim();


            if (!name) {
                continue;
            }


            if (
                isExcludedMTFItem(
                    name
                )
            ) {

                continue;
            }


            const value =
                toNumber(
                    match[2]
                );


            if (
                value === null
            ) {

                continue;
            }


            measurements.push({

                name:
                    name,

                value:
                    value,

                lower:
                    null,

                upper:
                    null,

                result:
                    "GOOD",

                type:
                    getMTFType(
                        name
                    )

            });

        }


        if (
            measurements.length > 0
        ) {

            const snMatch =
                text.match(
                    /(?:^|\n)\s*SN:\s*([A-Za-z0-9._-]+)/i
                );


            records.push({

                sn:
                    snMatch
                        ? cleanSN(
                            snMatch[1]
                          )
                        : "",

                workNo:
                    "",

                time:
                    "",

                stationIP:
                    "",

                source:
                    "LOG",

                measurements:
                    measurements

            });

        }

    }


    return records;
}


/* ============================================================
   GROUP RECORDS
============================================================ */

function groupRecords(records) {

    groupedData = {};


    records.forEach(
        function(record, index) {

            /*
             * Extra protection:
             *
             * Remove any empty measurements before
             * grouping.
             */

            record.measurements =
                Array.isArray(
                    record.measurements
                )
                    ? record.measurements.filter(
                        function(m) {

                            return (
                                m &&
                                String(
                                    m.name ?? ""
                                ).trim() !== "" &&
                                m.value !== null &&
                                m.value !== undefined &&
                                Number.isFinite(
                                    Number(m.value)
                                )
                            );

                        }
                    )
                    : [];


            /*
             * Do not keep records that contain
             * zero valid measurements.
             */

            if (
                record.measurements.length === 0
            ) {

                return;
            }


            const sn =
                record.sn &&
                record.sn.trim()
                    ? record.sn.trim()
                    : "NO SN";


            if (
                !groupedData[sn]
            ) {

                groupedData[sn] = {

                    sn:
                        sn,

                    tests:
                        [],

                    overall:
                        "GOOD",

                    dayNG:
                        false,

                    nightNG:
                        false

                };

            }


            record.originalIndex =
                index;


            groupedData[sn]
                .tests
                .push(record);


            /*
             * Check NG by MODE.
             */

            record.measurements
                .forEach(
                    function(m) {

                        if (
                            m.result !== "NG"
                        ) {

                            return;
                        }


                        groupedData[sn]
                            .overall =
                                "NG";


                        /*
                         * IR = NIGHT MODE.
                         * Everything else = DAY MODE.
                         */

                        if (
                            m.type === "NIGHT"
                        ) {

                            groupedData[sn]
                                .nightNG =
                                true;

                        } else {

                            groupedData[sn]
                                .dayNG =
                                true;

                        }

                    }
                );

        }
    );


    /*
     * Sort every SN's test logs.
     */

    Object.values(
        groupedData
    ).forEach(
        function(snData) {

            snData.tests.sort(
                function(a, b) {

                    const ta =
                        parseTimeValue(
                            a.time
                        );

                    const tb =
                        parseTimeValue(
                            b.time
                        );


                    if (
                        ta !== null &&
                        tb !== null
                    ) {

                        return ta - tb;
                    }


                    return (
                        a.originalIndex -
                        b.originalIndex
                    );

                }
            );


            snData.tests.forEach(
                function(test, index) {

                    test.testNumber =
                        index + 1;

                }
            );

        }
    );

}


/* ============================================================
   BUILD STATION + COLLIMATOR NG SUMMARY
============================================================ */

function buildNGSummaryData(records) {

    stationNGData = {};

    collimatorNGDataByFixture = {};


    records.forEach(
        function(record) {

            /*
             * Ignore records without valid measurements.
             */

            if (
                !Array.isArray(
                    record.measurements
                ) ||
                record.measurements.length === 0
            ) {

                return;
            }


            /*
             * Station IP = FIXTURE
             */

            let station =
                String(
                    record.stationIP ?? ""
                ).trim();


            /*
             * Never use a blank Station IP.
             */

            if (!station) {

                station =
                    "UNKNOWN";

            }


            /*
             * Create fixture container.
             */

            if (
                !collimatorNGDataByFixture[station]
            ) {

                collimatorNGDataByFixture[station] = {};

            }


            record.measurements
                .forEach(
                    function(m) {

                        /*
                         * Extra protection against
                         * blank measurements.
                         */

                        const collimator =
                            String(
                                m?.name ?? ""
                            ).trim();


                        if (!collimator) {

                            return;

                        }


                        if (
                            m.value === null ||
                            m.value === undefined ||
                            !Number.isFinite(
                                Number(m.value)
                            )
                        ) {

                            return;

                        }


                        /*
                         * ONLY COUNT NG.
                         */

                        if (
                            String(
                                m.result ?? ""
                            ).toUpperCase() !== "NG"
                        ) {

                            return;

                        }


                        /*
                         * STATION / FIXTURE TOTAL
                         */

                        if (
                            !stationNGData[station]
                        ) {

                            stationNGData[station] =
                                0;

                        }


                        stationNGData[station]++;


                        /*
                         * COLLIMATOR NG
                         */

                        if (
                            !collimatorNGDataByFixture[
                                station
                            ][collimator]
                        ) {

                            collimatorNGDataByFixture[
                                station
                            ][collimator] = 0;

                        }


                        collimatorNGDataByFixture[
                            station
                        ][collimator]++;

                    }
                );

        }
    );

}


/* ============================================================
   SUMMARY
============================================================ */

function renderSummary() {

    const snList =
        Object.values(
            groupedData
        );


    let good = 0;

    let ng = 0;

    let tests = 0;


    snList.forEach(

        .textContent =

    document
        .getElementById("ngSN")
        .textContent =
            ng;


    document
        .getElementById("totalTests")
        .textContent =
            tests;


    document
        .getElementById("summaryCard")
        .style.display =
            "block";

}

        Object.keys(
            collimatorNGDataByFixture
        )
        .filter(
            function(stationIP) {

                ).trim() !== "";

            }
        )
        .sort(
            naturalCompare
        );


    if (
        fixtures.length === 0
    ) {

    fixtures.forEach(
        function(stationIP, fixtureIndex) {

            const fixtureData =
                collimatorNGDataByFixture[

                        );

/* ============================================================
   FILTER
============================================================ */

function setFilter(filter) {

    currentFilter =
        filter;


    document
        .getElementById("filterAll")
        .classList.toggle(
            "active",
            filter === "ALL"
        );


    document
        .getElementById("filterNG")
        .classList.toggle(
            "active",
            filter === "NG"
        );


    document
        .getElementById("filterGOOD")
        .classList.toggle(
            "active",
            filter === "GOOD"
        );


    applyFilters();

}


/* ============================================================
   SEARCH
============================================================ */

function applyFilters() {

    const search =
        document
            .getElementById("snSearch")
            .value
            .trim()
            .toLowerCase();


    const cards =
        document.querySelectorAll(
            ".sn-card"
        );


    let visible = 0;


    cards.forEach(
        function(card) {

            const sn =
                card.dataset.sn
                    .toLowerCase();


            const status =
                card.dataset.status;


            const matchesSearch =
                sn.includes(search);


            const matchesFilter =
                currentFilter === "ALL" ||
                (
                    currentFilter === "NG" &&
                    status === "NG"
                ) ||
                (
                    currentFilter === "GOOD" &&
                    status === "GOOD"
                );


            const show =
                matchesSearch &&
                matchesFilter;


            card.style.display =
                show
                    ? ""
                    : "none";


            if (show) {
                visible++;
            }

        }
    );


    const noResults =
        document.getElementById(
            "noFilterResults"
        );


    if (
        noResults
    ) {

        noResults.remove();

    }


    if (
        visible === 0 &&
        cards.length > 0
    ) {

        const container =
            document.getElementById(
                "resultList"
            );


        const message =
            document.createElement(
                "div"
            );


        message.id =
            "noFilterResults";


        message.className =
            "no-results";


        message.textContent =
            "No SN matches the current search/filter.";


        container.appendChild(
            message
        );

    }

}

            "div"
        );


    title.className =
        "test-title";


    title.textContent =
        "Test Log " +
        test.testNumber;


    const time =
        document.createElement(
            "div"
        );


    time.className =
        "test-time";


    time.textContent =
        test.time ||
        "Time not available";


    header.appendChild(title);

    header.appendChild(time);


    const body =
        document.createElement(
            "div"
        );


    body.className =
        "test-body";


    const measurements =
        [...test.measurements]
            .filter(
                function(m) {

                    return (
                        m &&
                        String(
                            m.name ?? ""
                        ).trim() !== "" &&
                        m.value !== null &&
                        m.value !== undefined &&
                        Number.isFinite(
                            Number(m.value)
                        );

                    }
                }
            )
            .sort(
                naturalMeasurementCompare
            );


    const day =
        measurements.filter(
            m =>
                m.type === "DAY"
        );


    const night =
        measurements.filter(
            m =>
                m.type === "NIGHT"
        );


    /*
     * DAY FIRST.
     */

    if (
        day.length > 0
    ) {

        body.appendChild(
            createModeSection(
                "DAY MODE",
                day,
                "day-mode-title"
            )
        );

    }


    /*
     * NIGHT SECOND.
     */

    if (
        night.length > 0
    ) {

        body.appendChild(
            createModeSection(
                "NIGHT MODE",
                night,
                "night-mode-title"
            )
        );

    }


    /*
     * GRAPH
     */

    if (
        measurements.length > 0
    ) {

        const chartTitle =
            document.createElement(
                "div"
            );


        chartTitle.className =
            "section-title";


        chartTitle.textContent =
            "MTF Graph — DAY MODE → NIGHT MODE";


        body.appendChild(
            chartTitle
        );


        const graph =
            document.createElement(
                "div"
            );


        graph.className =
            "graph-container";


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.chartData =
            measurements;


        graph.appendChild(
            canvas
        );


        body.appendChild(
            graph
        );

    }


    wrapper.appendChild(header);

    wrapper.appendChild(body);


    return wrapper;
}


/* ============================================================
   MODE SECTION
============================================================ */

function createModeSection(
    title,
    measurements,
    titleClass
) {

    const section =
        document.createElement(
            "div"
        );


    const titleElement =
        document.createElement(
            "div"
        );


    titleElement.className =
        "mode-title " +
        titleClass;


    titleElement.textContent =
        title;


    section.appendChild(
        titleElement
    );


    const tableWrapper =
        document.createElement(
            "div"
        );


    tableWrapper.className =
        "mtf-table-wrapper";


    const table =
        document.createElement(
            "table"
        );


    const thead =
        document.createElement(
            "thead"
        );


    const headerRow =
        document.createElement(
            "tr"
        );


    [
        "MTF Item",
        "Value",
        "LL",
        "Result"
    ].forEach(
        function(text) {

            const th =
                document.createElement(
                    "th"
                );


            th.textContent =
                text;


            headerRow.appendChild(th);

        }
    );


    thead.appendChild(
        headerRow
    );


    const tbody =
        document.createElement(
            "tbody"
        );


    measurements.forEach(
        function(m) {

            /*
             * Final safety check.
             */

            if (
                !m ||
                String(
                    m.name ?? ""
                ).trim() === "" ||
                m.value === null ||
                m.value === undefined
            ) {

                return;

            }


            const row =
                document.createElement(
                    "tr"
                );


            row.className =
                m.result === "NG"
                    ? "ng-row"
                    : "pass-row";


            /*
             * ITEM
             */

            const itemCell =
                document.createElement(
                    "td"
                );


            itemCell.textContent =
                m.name;


            row.appendChild(
                itemCell
            );


            /*
             * VALUE
             */

            const valueCell =
                document.createElement(
                    "td"
                );


            valueCell.textContent =
                formatNumber(
                    m.value
                );


            row.appendChild(
                valueCell
            );


            /*
             * LL
             */

            const lowerCell =
                document.createElement(
                    "td"
                );


            lowerCell.textContent =
                formatNumber(
                    m.lower
                );


            row.appendChild(
                lowerCell
            );


            /*
             * RESULT
             */

            const resultCell =
                document.createElement(
                    "td"
                );


            resultCell.textContent =
                m.result;


            resultCell.className =
                m.result === "NG"
                    ? "result-ng"
                    : "result-pass";


            row.appendChild(
                resultCell
            );


            tbody.appendChild(
                row
            );

        }
    );


    table.appendChild(
        thead
    );


    table.appendChild(
        tbody
    );


    tableWrapper.appendChild(
        table
    );


    section.appendChild(
        tableWrapper
    );


    return section;
}


/* ============================================================
   GRAPH
============================================================ */

function drawChart(canvas) {

    if (
        !canvas ||
        !canvas.chartData
    ) {

        return;
    }


    if (
        chartInstances.has(canvas)
    ) {

        try {

            chartInstances
                .get(canvas)
                .destroy();

        } catch(e) {}

    }


    const measurements =
        canvas.chartData
            .filter(
                function(m) {

                    return (
                        m &&
                        String(
                            m.name ?? ""
                        ).trim() !== "" &&
                        m.value !== null &&
                        m.value !== undefined &&
                        Number.isFinite(
                            Number(m.value)
                        )
                    );

                }
            );


    const labels =
        measurements.map(
            m => m.name
        );


    const values =
        measurements.map(
            m => m.value
        );


    const lower =
        measurements.map(
            m => m.lower
        );


    const datasets = [

        {
            label:
                "MTF Value",

            data:
                values,

            borderWidth:
                2,

            pointRadius:
                4,

            tension:
                0.2

        },

        {
            label:
                "LL",

            data:
                lower,

            borderWidth:
                2,

            borderDash:
                [
                    6,
                    4
                ],

            pointRadius:
                0,

            spanGaps:
                true

        }

    ];


    const chart =
        new Chart(
            canvas.getContext("2d"),
            {

                type:
                    "line",


                data: {

                    labels:
                        labels,

                    datasets:
                        datasets

                },


                options: {

                    responsive:
                        true,

                    maintainAspectRatio:
                        false,


                    interaction: {

                        mode:
                            "index",

                        intersect:
                            false

                    },


                    plugins: {

                        legend: {

                            display:
                                true

                        },


                        tooltip: {

                            callbacks: {

                                afterBody:
                                    function(context) {

                                        if (
                                            !context ||
                                            !context.length
                                        ) {

                                            return [];

                                        }


                                        const index =
                                            context[0]
                                                .dataIndex;


                                        const item =
                                            measurements[
                                                index
                                            ];


                                        return [

                                            "Mode: " +
                                            (
                                                item.type === "NIGHT"
                                                    ? "NIGHT MODE"
                                                    : "DAY MODE"
                                            ),

                                            "Result: " +
                                            item.result

                                        ];

                                    }

                            }

                        }

                    },


                    scales: {

                        x: {

                            ticks: {

                                autoSkip:
                                    false,

                                maxRotation:
                                    75,

                                minRotation:
                                    45

                            }

                        },


                        y: {

                            beginAtZero:
                                false

                        }

                    }

                }

            }
        );


    chartInstances.set(
        canvas,
        chart
    );

}


/* ============================================================
   NATURAL ITEM SORT
============================================================ */

function naturalMeasurementCompare(a, b) {

    /*
     * DAY MODE always first.
     */

    const modeA =
        a.type === "NIGHT"
            ? 1
            : 0;


    const modeB =
        b.type === "NIGHT"
            ? 1
            : 0;


    if (
        modeA !== modeB
    ) {

        return modeA - modeB;

    }


    return naturalCompare(
        a.name,
        b.name
    );

}


function naturalCompare(a, b) {

    const aa =
        String(a || "")
            .toLowerCase()
            .match(
                /\d+|\D+/g
            ) || [];


    const bb =
        String(b || "")
            .toLowerCase()
            .match(
                /\d+|\D+/g
            ) || [];


    const length =
        Math.max(
            aa.length,
            bb.length
        );


    for (
        let i = 0;
        i < length;
        i++
    ) {

        if (
            aa[i] === undefined
        ) {

            return -1;
        }


        if (
            bb[i] === undefined
        ) {

            return 1;
        }


        if (
            aa[i] === bb[i]
        ) {

            continue;
        }


        const na =
            Number(aa[i]);


        const nb =
            Number(bb[i]);


        if (
            !Number.isNaN(na) &&
            !Number.isNaN(nb)
        ) {

            return na - nb;

        }


        return aa[i]
            .localeCompare(
                bb[i]
            );

    }


    return 0;
}


/* ============================================================
   EXCLUDED MTF ITEMS
============================================================ */

function isExcludedMTFItem(name) {

    const upper =
        String(name || "")
            .toUpperCase()
            .replace(/\s+/g, "");


    if (
        upper.includes("VIS_LP-MM") ||
        upper.includes("VIS_DISTANCE") ||
        upper.includes("IR_LP-MM") ||
        upper.includes("IR_DISTANCE")
    ) {

        return true;
    }


    return false;
}


/* ============================================================
   MTF TYPE
============================================================ */

function getMTFType(name) {

    const upper =
        String(name || "")
            .toUpperCase();


    /*
     * IR = NIGHT MODE.
     */

    if (
        upper.includes("IR")
    ) {

        return "NIGHT";
    }


    return "DAY";
}


/* ============================================================
   STATION IP HEADER DETECTION
============================================================ */

function findStationIPHeader(headers) {

    const possibleNames = [

        "STATIONIP",
        "STATION IP",
        "STATION_IP",
        "STATION-IP",
        "STATIONADDRESS",
        "STATION ADDRESS",
        "TESTERIP",
        "TESTER IP",
        "TESTER_IP",
        "MACHINEIP",
        "MACHINE IP",
        "MACHINE_IP",
        "IP"

    ];


    for (
        const wanted of possibleNames
    ) {

        const index =
            findHeader(
                headers,
                wanted
            );


        if (
            index >= 0
        ) {

            return index;
        }

    }


    for (
        let i = 0;
        i < headers.length;
        i++
    ) {

        const header =
            String(
                headers[i] || ""
            )
            .trim()
            .toUpperCase()
            .replace(
                /[\s_.-]/g,
                ""
            );


        if (
            header.includes("STATIONIP")
        ) {

            return i;
        }

    }


    return -1;
}


/* ============================================================
   NUMBER HELPERS
============================================================ */

function findHeader(
    headers,
    wanted
) {

    if (
        wanted === undefined ||
        wanted === null
    ) {

        return -1;
    }


    const target =
        String(wanted)
            .toLowerCase()
            .replace(
                /[\s_.-]/g,
                ""
            );


    for (
        let i = 0;
        i < headers.length;
        i++
    ) {

        const current =
            String(
                headers[i] || ""
            )
            .toLowerCase()
            .replace(
                /[\s_.-]/g,
                ""
            );


        if (
            current === target
        ) {

            return i;
        }

    }


    return -1;
}


function getFirstExistingValue(
    row,
    indexes
) {

    for (
        const index of indexes
    ) {

        if (
            index !== undefined &&
            index !== null &&
            index >= 0 &&
            row[index] !== undefined &&
            row[index] !== null &&
            String(
                row[index]
            ).trim() !== ""
        ) {

            return String(
                row[index]
            ).trim();

        }

    }


    return "";
}


function getSpecValue(
    row,
    index
) {

    if (
        !row ||
        index < 0 ||
        index >= row.length
    ) {

        return null;
    }


    return toNumber(
        row[index]
    );
}


/* ============================================================
   NUMBER CONVERTER
============================================================ */

function toNumber(value) {

    if (
        value === undefined ||
        value === null
    ) {

        return null;
    }


    const text =
        String(value)
            .trim();


    /*
     * EMPTY = NO DATA.
     */

    if (
        text === ""
    ) {

        return null;
    }


    /*
     * Explicit non-data values.
     */

    const lowerText =
        text.toLowerCase();


    if (
        text === "-" ||
        lowerText === "na" ||
        lowerText === "n/a" ||
        lowerText === "null" ||
        lowerText === "none"
    ) {

        return null;
    }


    const cleaned =
        text.replace(
            /[^0-9eE+.\-]/g,
            ""
        );


    if (
        cleaned === ""
    ) {

        return null;
    }


    const number =
        Number(cleaned);


    return Number.isFinite(number)
        ? number
        : null;
}


/* ============================================================
   RESULT
============================================================ */

function evaluateResult(
    value,
    lower,
    upper
) {

    if (
        value === null ||
        value === undefined
    ) {

        return null;
    }


    if (
        lower !== null &&
        lower !== undefined &&
        value < lower
    ) {

        return "NG";
    }


    if (
        upper !== null &&
        upper !== undefined &&
        value > upper
    ) {

        return "NG";
    }


    return "GOOD";
}


/* ============================================================
   SN CLEAN
============================================================ */

function cleanSN(sn) {

    if (
        sn === undefined ||
        sn === null
    ) {

        return "";
    }


    let value =
        String(sn).trim();


    value =
        value.replace(
            /^["']|["']$/g,
            ""
        );


    return value;
}


/* ============================================================
   FORMAT NUMBER
============================================================ */

function formatNumber(value) {

    if (
        value === null ||
        value === undefined ||
        Number.isNaN(value)
    ) {

        return "—";
    }


    return Number(value)
        .toFixed(3)
        .replace(
            /\.?0+$/,
            ""
        );
}


/* ============================================================
   TIME SORT
============================================================ */

function parseTimeValue(time) {

    if (
        !time
    ) {

        return null;
    }


    const parsed =
        Date.parse(
            String(time)
        );


    if (
        Number.isNaN(parsed)
    ) {

        return null;
    }


    return parsed;
}


/* ============================================================
   ERROR
============================================================ */

function showError(message) {

    const box =
        document
            .getElementById(
                "errorBox"
            );


    box.textContent =
        message;


    box.style.display =
        "block";
}


function hideError() {

    const box =
        document
            .getElementById(
                "errorBox"
            );


    box.style.display =
        "none";


    box.textContent =
        "";
}


/* ============================================================
   CLEAR
============================================================ */

function clearAll() {

    document
        .getElementById("logInput")
        .value = "";

    document
        .getElementById("fileInput")
        .value = "";

    document
        .getElementById("fileInfo")
        .textContent = "";

    document
        .getElementById("summaryCard")
        .style.display = "none";

    document
        .getElementById("stationGraphCard")
        .style.display = "none";

    document
        .getElementById("collimatorGraphsContainer")
        .innerHTML = "";

    document
        .getElementById("resultsCard")
        .style.display = "none";

    document
        .getElementById("resultList")
        .innerHTML = "";

    document
        .getElementById("snSearch")
        .value = "";

    groupedData = {};

    originalRecords = [];

    stationNGData = {};

    collimatorNGDataByFixture = {};


    /*
     * Destroy individual SN charts.
     */

    chartInstances.forEach(
        function(chart) {

            try {

                chart.destroy();

            } catch (e) {}

        }
    );

    chartInstances.clear();


    /*
     * Destroy Station graph.
     */

    if (stationChartInstance) {

        try {

            stationChartInstance.destroy();

        } catch (e) {}

        stationChartInstance = null;

    }


    /*
     * Destroy Collimator graphs.
     */

    collimatorChartInstances.forEach(
        function(chart) {

            try {

                chart.destroy();

            } catch (e) {}

        }
    );

    collimatorChartInstances.clear();


    /*
     * Reset filter.
     */

    currentFilter = "ALL";


    document
        .getElementById("filterAll")
        .classList.add("active");

    document
        .getElementById("filterNG")
        .classList.remove("active");

    document
        .getElementById("filterGOOD")
        .classList.remove("active");


    hideError();

}
