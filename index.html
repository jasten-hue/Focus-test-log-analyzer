<!DOCTYPE html>
<html lang="en">
<head>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;

    textarea {

<body>

<div class="header">
    <h1>FOCUS TEST LOG ANALYZER</h1>
    <p>MTF VIS / IR log and SPC data analyzer</p>
</div>

<div class="container">

    <div class="card">

        <div class="input-title">
            Paste Log / CSV Data
        </div>

        <textarea
            id="logInput"
            placeholder="Paste your .log or .csv data here..."
        ></textarea>

        <div class="buttons">

            <label class="file-label">
                Browse Data
                <input
                    type="file"
                    id="fileInput"
                    accept=".log,.txt,.csv"
                >
            </label>

            <button
                class="analyze-btn"
                onclick="analyzeLog()"
            >
                Analyze
            </button>

            <button
                class="clear-btn"
                onclick="clearAll()"
            >
                Clear
            </button>

        </div>

        <div
            id="fileInfo"
            class="format-info"
        ></div>

    </div>

    <div
        id="errorBox"
        class="error"
    ></div>

    <div
        id="summaryCard"
        class="card"
        style="display:none;"
    >

        <div class="input-title">
            Test Summary
        </div>

        <div class="summary-grid">

            <div class="summary-box">
                <div class="label">Total SN</div>
                <div
                    id="totalSN"
                    class="number"
                >0</div>
            </div>

            <div class="summary-box">
                <div class="label">GOOD</div>
                <div
                    id="goodSN"
                    class="number good-number"
                >0</div>
            </div>

            <div class="summary-box">
                <div class="label">NG</div>
                <div
                    id="ngSN"
                    class="number ng-number"
                >0</div>
            </div>

            <div class="summary-box">
                <div class="label">Test Logs</div>
                <div
                    id="totalTests"
                    class="number"
                >0</div>
            </div>

        </div>

    </div>

    <div
        id="resultsCard"
        class="card"
        style="display:none;"
    >

        <div class="input-title">
            SN Results
        </div>

        <div
            id="resultList"
            class="result-list"
        ></div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

/* ============================================================
   GLOBAL DATA
   ============================================================ */

let groupedData = {};
let chartInstances = {};


/* ============================================================
   FILE BROWSER
   ============================================================ */

document
    .getElementById("fileInput")
    .addEventListener("change", function(event) {

        const file = event.target.files[0];

        if (!file) {
            return;
        }

        const reader = new FileReader();

        reader.onload = function(e) {

            document
                .getElementById("logInput")
                .value = e.target.result;

            document
                .getElementById("fileInfo")
                .textContent =
                    "Loaded: " +
                    file.name +
                    " (" +
                    file.size.toLocaleString() +
                    " bytes)";

        };

        reader.onerror = function() {

            showError(
                "Unable to read the selected file."
            );

        };

        reader.readAsText(file);
    });


/* ============================================================
   MAIN ANALYZER
   ============================================================ */

function analyzeLog() {

    hideError();

    const raw =
        document
            .getElementById("logInput")
            .value;

    if (!raw.trim()) {

        showError(
            "Please paste a log or browse for a file first."
        );

        return;
    }

    groupedData = {};

    const format =
        detectFormat(raw);

    let records = [];

    if (format === "CSV") {

        records =
            parseCSVData(raw);

    } else {

        records =
            parseOriginalLog(raw);
    }

    /*
     * If the first parser didn't find anything,
     * try the other parser automatically.
     */
    if (records.length === 0) {

        if (format === "CSV") {

            records =
                parseOriginalLog(raw);

        } else {

            records =
                parseCSVData(raw);
        }
    }

    if (records.length === 0) {

        showError(
            "No MTF data was found. The file was loaded, but its structure could not be recognized."
        );

        return;
    }

    groupRecords(records);

    renderSummary();

    renderResults();

}


/* ============================================================
   FORMAT DETECTION
   ============================================================ */

function detectFormat(text) {

    const lower =
        text.toLowerCase();

    if (
        lower.includes("pcba,") &&
        (
            lower.includes("stampTime".toLowerCase()) ||
            lower.includes("workno")
        )
    ) {

        return "CSV";
    }

    if (
        lower.includes("item_mtf") ||
        lower.includes("spec: lower")
    ) {

        return "LOG";
    }

    /*
     * CSV fallback
     */
    if (
        lower.includes(",") &&
        lower.includes("lower")
    ) {

        return "CSV";
    }

    return "LOG";
}


/* ============================================================
   CSV PARSER
   ============================================================ */

function parseCSVLine(line) {

    const values = [];

    let current = "";

    let inQuotes = false;

    for (
        let i = 0;
        i < line.length;
        i++
    ) {

        const char =
            line[i];

        if (char === '"') {

            if (
                inQuotes &&
                line[i + 1] === '"'
            ) {

                current += '"';

                i++;

            } else {

                inQuotes =
                    !inQuotes;
            }

        } else if (
            char === "," &&
            !inQuotes
        ) {

            values.push(
                current.trim()
            );

            current = "";

        } else {

            current += char;
        }
    }

    values.push(
        current.trim()
    );

    return values;
}


function parseCSVData(text) {

    const records = [];

    const lines =
        text
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .split("\n");

    let headerIndex = -1;

    /*
     * Locate actual header.
     */
    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const lower =
            lines[i].toLowerCase();

        if (
            lower.includes("pcba") &&
            lower.includes("workno") &&
            lower.includes("stamptime")
        ) {

            headerIndex = i;

            break;
        }
    }

    if (headerIndex === -1) {

        return records;
    }

    const headers =
        parseCSVLine(
            lines[headerIndex]
        );

    /*
     * Find special specification rows.
     */
    const specRows = {};

    /*
     * We allow the CSV to contain several
     * data rows before specification rows.
     */
    for (
        let i = headerIndex + 1;
        i < lines.length;
        i++
    ) {

        const row =
            parseCSVLine(lines[i]);

        if (!row.length) {
            continue;
        }

        const first =
            String(row[0] || "")
                .trim()
                .toLowerCase();

        if (
            [
                "lower",
                "upper",
                "min",
                "max",
                "mean",
                "sigma",
                "cpl",
                "cpu",
                "cplu"
            ].includes(first)
        ) {

            specRows[first] =
                row;
        }
    }

    /*
     * Determine columns that are actual MTF columns.
     */
    const measurementColumns = [];

    for (
        let i = 0;
        i < headers.length;
        i++
    ) {

        const header =
            String(headers[i] || "")
                .trim();

        const upper =
            header.toUpperCase();

        if (
            upper.includes("MTF")
        ) {

            measurementColumns.push(i);
        }
    }

    /*
     * If no MTF header was found, stop.
     */
    if (
        measurementColumns.length === 0
    ) {

        return records;
    }

    /*
     * Every normal CSV row is treated as a
     * separate test record.
     */
    for (
        let rowIndex = headerIndex + 1;
        rowIndex < lines.length;
        rowIndex++
    ) {

        const row =
            parseCSVLine(
                lines[rowIndex]
            );

        if (
            row.length === 0
        ) {
            continue;
        }

        const first =
            String(row[0] || "")
                .trim()
                .toLowerCase();

        /*
         * Skip specification rows.
         */
        if (
            [
                "lower",
                "upper",
                "min",
                "max",
                "mean",
                "sigma",
                "cpl",
                "cpu",
                "cplu"
            ].includes(first)
        ) {

            continue;
        }

        /*
         * Ignore completely empty rows.
         */
        if (
            row.every(
                x => String(x).trim() === ""
            )
        ) {

            continue;
        }

        /*
         * The CSV normally has:
         *
         * PCBA
         * WorkNo
         * StampTime
         * ...
         */

        const sn =
            getFirstExistingValue(
                row,
                [
                    findHeader(headers, "SN"),
                    findHeader(headers, "SERIAL"),
                    findHeader(headers, "SERIALNUMBER"),
                    findHeader(headers, "PCBA")
                ]
            );

        const workNo =
            getFirstExistingValue(
                row,
                [
                    findHeader(headers, "WORKNO"),
                    findHeader(headers, "WORKNO."),
                    findHeader(headers, "WORK NO")
                ]
            );

        const stampTime =
            getFirstExistingValue(
                row,
                [
                    findHeader(headers, "STAMPTIME"),
                    findHeader(headers, "DATE_TIME"),
                    findHeader(headers, "DATETIME")
                ]
            );

        /*
         * A row without any MTF value isn't
         * considered a test log.
         */
        let hasMeasurement = false;

        const measurements = [];

        for (
            const columnIndex of measurementColumns
        ) {

            const itemName =
                String(
                    headers[columnIndex] || ""
                ).trim();

            const rawValue =
                row[columnIndex];

            const value =
                toNumber(rawValue);

            /*
             * Ignore specification-only cells.
             */
            if (
                value === null
            ) {

                continue;
            }

            hasMeasurement = true;

            const lower =
                getSpecValue(
                    specRows.lower,
                    columnIndex
                );

            const upper =
                getSpecValue(
                    specRows.upper,
                    columnIndex
                );

            const min =
                getSpecValue(
                    specRows.min,
                    columnIndex
                );

            const max =
                getSpecValue(
                    specRows.max,
                    columnIndex
                );

            const mean =
                getSpecValue(
                    specRows.mean,
                    columnIndex
                );

            const sigma =
                getSpecValue(
                    specRows.sigma,
                    columnIndex
                );

            const result =
                evaluateResult(
                    value,
                    lower,
                    upper
                );

            measurements.push({

                name: itemName,

                value: value,

                lower: lower,

                upper: upper,

                min: min,

                max: max,

                mean: mean,

                sigma: sigma,

                result: result,

                type: getMTFType(itemName)

            });
        }

        if (
            hasMeasurement
        ) {

            records.push({

                sn:
                    cleanSN(sn),

                workNo:
                    workNo || "",

                time:
                    stampTime || "",

                source:
                    "CSV",

                measurements:
                    measurements
            });
        }
    }

    /*
     * If this CSV actually represents one test
     * with specification rows and there were no
     * normal measurement rows, build one record
     * from the Mean row.
     */
    if (
        records.length === 0 &&
        specRows.mean
    ) {

        const measurements = [];

        for (
            const columnIndex of measurementColumns
        ) {

            const itemName =
                String(
                    headers[columnIndex] || ""
                ).trim();

            const value =
                getSpecValue(
                    specRows.mean,
                    columnIndex
                );

            if (
                value === null
            ) {
                continue;
            }

            const lower =
                getSpecValue(
                    specRows.lower,
                    columnIndex
                );

            const upper =
                getSpecValue(
                    specRows.upper,
                    columnIndex
                );

            measurements.push({

                name: itemName,

                value: value,

                lower: lower,

                upper: upper,

                min:
                    getSpecValue(
                        specRows.min,
                        columnIndex
                    ),

                max:
                    getSpecValue(
                        specRows.max,
                        columnIndex
                    ),

                mean: value,

                sigma:
                    getSpecValue(
                        specRows.sigma,
                        columnIndex
                    ),

                result:
                    evaluateResult(
                        value,
                        lower,
                        upper
                    ),

                type:
                    getMTFType(itemName)

            });
        }

        if (
            measurements.length > 0
        ) {

            records.push({

                sn:
                    "",

                workNo:
                    "",

                time:
                    "",

                source:
                    "CSV",

                measurements:
                    measurements
            });
        }
    }

    return records;
}


/* ============================================================
   ORIGINAL LOG PARSER
   ============================================================ */

function parseOriginalLog(text) {

    const records = [];

    const lines =
        text
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .split("\n");

    let currentRecord = null;

    /*
     * Each test file begins with:
     *
     * Load SNFile: SN_xxxxx.csv
     */
    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i];

        /*
         * Detect new SN.
         */
        const snMatch =
            line.match(
                /(?:Load SNFile:\s*|SN:\s*)([A-Za-z0-9._-]+)/
            );

        if (
            snMatch
        ) {

            /*
             * Save previous record.
             */
            if (
                currentRecord &&
                currentRecord.measurements.length > 0
            ) {

                records.push(
                    currentRecord
                );
            }

            currentRecord = {

                sn:
                    cleanSN(
                        snMatch[1]
                    ),

                workNo:
                    "",

                time:
                    "",

                source:
                    "LOG",

                measurements:
                    []
            };

            continue;
        }

        /*
         * Get Date_Time.
         */
        const dateMatch =
            line.match(
                /Date_Time:\s*(.+)/
            );

        if (
            dateMatch &&
            currentRecord
        ) {

            currentRecord.time =
                dateMatch[1].trim();

            continue;
        }

        /*
         * Get Item:
         *
         * 1-Item: MTF_1A_1_H; Value: 55.50
         * [ SPEC: LOWER=25.0 ]
         */
        const itemMatch =
            line.match(
                /Item:\s*([^;]+);\s*Value:\s*([+-]?\d+(?:\.\d+)?)/
            );

        if (
            itemMatch &&
            currentRecord
        ) {

            const name =
                itemMatch[1].trim();

            const value =
                Number(
                    itemMatch[2]
                );

            let lower = null;
            let upper = null;

            /*
             * Look ahead for specification.
             */
            for (
                let j = i;
                j < Math.min(i + 3, lines.length);
                j++
            ) {

                const specMatch =
                    lines[j].match(
                        /SPEC:\s*LOWER=([+-]?\d+(?:\.\d+)?)/i
                    );

                if (
                    specMatch
                ) {

                    lower =
                        Number(
                            specMatch[1]
                        );

                    break;
                }
            }

            const result =
                evaluateResult(
                    value,
                    lower,
                    upper
                );

            currentRecord.measurements.push({

                name:
                    name,

                value:
                    value,

                lower:
                    lower,

                upper:
                    upper,

                min:
                    null,

                max:
                    null,

                mean:
                    null,

                sigma:
                    null,

                result:
                    result,

                type:
                    getMTFType(name)
            });
        }
    }

    /*
     * Save final record.
     */
    if (
        currentRecord &&
        currentRecord.measurements.length > 0
    ) {

        records.push(
            currentRecord
        );
    }

    /*
     * Some logs don't contain Load SNFile
     * in the exact expected location.
     *
     * Try extracting SN from:
     *
     * SN: XXXXX
     */
    if (
        records.length === 0
    ) {

        const snMatches =
            [
                ...text.matchAll(
                    /(?:^|\n)\s*SN:\s*([A-Za-z0-9._-]+)/gi
                )
            ];

        /*
         * If measurements exist but SN is missing,
         * preserve them instead of discarding.
         */
        const measurements =
            [];

        for (
            const line of lines
        ) {

            const match =
                line.match(
                    /Item:\s*([^;]+);\s*Value:\s*([+-]?\d+(?:\.\d+)?)/
                );

            if (
                match
            ) {

                const name =
                    match[1].trim();

                const value =
                    Number(
                        match[2]
                    );

                measurements.push({

                    name:
                        name,

                    value:
                        value,

                    lower:
                        null,

                    upper:
                        null,

                    min:
                        null,

                    max:
                        null,

                    mean:
                        null,

                    sigma:
                        null,

                    result:
                        "GOOD",

                    type:
                        getMTFType(name)
                });
            }
        }

        if (
            measurements.length > 0
        ) {

            records.push({

                sn:
                    snMatches.length > 0
                        ? cleanSN(
                            snMatches[0][1]
                          )
                        : "",

                workNo:
                    "",

                time:
                    "",

                source:
                    "LOG",

                measurements:
                    measurements
            });
        }
    }

    return records;
}


/* ============================================================
   GROUP BY SN
   ============================================================ */

function groupRecords(records) {

    groupedData = {};

    records.forEach(
        function(record, index) {

            /*
             * Do NOT invent an SN.
             */
            const sn =
                record.sn &&
                record.sn.trim()
                    ? record.sn.trim()
                    : "NO SN";

            if (
                !groupedData[sn]
            ) {

                groupedData[sn] = {

                    sn:
                        sn,

                    tests:
                        [],

                    overall:
                        "GOOD",

                    ngTypes:
                        new Set(),

                    ngItems:
                        []
                };
            }

            /*
             * Preserve test order.
             */
            record.testNumber =
                groupedData[sn]
                    .tests.length + 1;

            groupedData[sn]
                .tests
                .push(record);

            /*
             * Check all MTF values.
             */
            record.measurements.forEach(
                function(m) {

                    if (
                        m.result === "NG"
                    ) {

                        groupedData[sn]
                            .overall =
                                "NG";

                        /*
                         * VIS has priority when
                         * an item is classified as VIS.
                         */
                        if (
                            m.type === "VIS"
                        ) {

                            groupedData[sn]
                                .ngTypes
                                .add("VIS NG");

                        } else if (
                            m.type === "IR"
                        ) {

                            groupedData[sn]
                                .ngTypes
                                .add("IR NG");
                        }

                        groupedData[sn]
                            .ngItems
                            .push(m);
                    }
                }
            );
        }
    );
}


/* ============================================================
   SUMMARY
   ============================================================ */

function renderSummary() {

    const snList =
        Object.values(
            groupedData
        );

    let good = 0;
    let ng = 0;
    let tests = 0;

    snList.forEach(
        function(item) {

            if (
                item.overall === "NG"
            ) {

                ng++;

            } else {

                good++;
            }

            tests +=
                item.tests.length;
        }
    );

    document
        .getElementById("totalSN")
        .textContent =
            snList.length;

    document
        .getElementById("goodSN")
        .textContent =
            good;

    document
        .getElementById("ngSN")
        .textContent =
            ng;

    document
        .getElementById("totalTests")
        .textContent =
            tests;

    document
        .getElementById("summaryCard")
        .style.display =
            "block";
}


/* ============================================================
   RESULTS
   ============================================================ */

function renderResults() {

    const container =
        document
            .getElementById("resultList");

    container.innerHTML = "";

    const snList =
        Object.values(
            groupedData
        );

    if (
        snList.length === 0
    ) {

        container.innerHTML =
            '<div class="empty">No results found.</div>';

        return;
    }

    snList.forEach(
        function(snData, index) {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "sn-card";

            const header =
                document.createElement(
                    "div"
                );

            header.className =
                "sn-header";

            const number =
                document.createElement(
                    "div"
                );

            number.className =
                "sn-number";

            number.textContent =
                index + 1;

            const sn =
                document.createElement(
                    "div"
                );

            sn.className =
                "sn-name";

            sn.textContent =
                snData.sn;

            const status =
                document.createElement(
                    "div"
                );

            status.className =
                "status " +
                (
                    snData.overall === "NG"
                        ? "ng"
                        : "good"
                );

            status.textContent =
                snData.overall;

            const description =
                document.createElement(
                    "div"
                );

            description.className =
                "ng-description";

            if (
                snData.overall === "NG"
            ) {

                const types =
                    Array.from(
                        snData.ngTypes
                    );

                /*
                 * VIS NG takes priority.
                 */
                if (
                    types.includes(
                        "VIS NG"
                    )
                ) {

                    description.textContent =
                        "VIS NG";

                } else {

                    description.textContent =
                        "IR NG";
                }

            } else {

                description.textContent =
                    "—";
            }

            const count =
                document.createElement(
                    "div"
                );

            count.className =
                "test-count";

            count.textContent =
                snData.tests.length +
                (
                    snData.tests.length === 1
                        ? " test log"
                        : " test logs"
                );

            header.appendChild(number);
            header.appendChild(sn);
            header.appendChild(status);
            header.appendChild(description);
            header.appendChild(count);

            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "sn-content";

            /*
             * Build every test separately.
             */
            snData.tests.forEach(
                function(test) {

                    content.appendChild(
                        createTestLog(
                            snData,
                            test
                        )
                    );
                }
            );

            header.addEventListener(
                "click",
                function() {

                    card.classList.toggle(
                        "expanded"
                    );

                    /*
                     * Render charts only when
                     * expanded.
                     */
                    if (
                        card.classList.contains(
                            "expanded"
                        )
                    ) {

                        setTimeout(
                            function() {

                                content
                                    .querySelectorAll(
                                        "canvas"
                                    )
                                    .forEach(
                                        function(canvas) {

                                            drawChart(
                                                canvas
                                            );
                                        }
                                    );

                            },
                            50
                        );
                    }
                }
            );

            card.appendChild(header);
            card.appendChild(content);

            container.appendChild(card);
        }
    );

    document
        .getElementById("resultsCard")
        .style.display =
            "block";
}


/* ============================================================
   TEST LOG UI
   ============================================================ */

function createTestLog(
    snData,
    test
) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "test-log";

    const header =
        document.createElement(
            "div"
        );

    header.className =
        "test-header";

    const title =
        document.createElement(
            "div"
        );

    title.className =
        "test-title";

    title.textContent =
        "Test Log " +
        test.testNumber;

    const time =
        document.createElement(
            "div"
        );

    time.className =
        "test-time";

    time.textContent =
        test.time ||
        "Time not available";

    header.appendChild(title);
    header.appendChild(time);

    const body =
        document.createElement(
            "div"
        );

    body.className =
        "test-body";

    /*
     * Group VIS and IR for readability.
     */
    const vis =
        test.measurements.filter(
            m => m.type === "VIS"
        );

    const ir =
        test.measurements.filter(
            m => m.type === "IR"
        );

    const other =
        test.measurements.filter(
            m =>
                m.type !== "VIS" &&
                m.type !== "IR"
        );

    if (
        vis.length > 0
    ) {

        body.appendChild(
            createMeasurementSection(
                "MTF VIS",
                vis
            )
        );
    }

    if (
        ir.length > 0
    ) {

        body.appendChild(
            createMeasurementSection(
                "MTF IR",
                ir
            )
        );
    }

    if (
        other.length > 0
    ) {

        body.appendChild(
            createMeasurementSection(
                "Other MTF",
                other
            )
        );
    }

    /*
     * Chart.
     */
    if (
        test.measurements.length > 0
    ) {

        const chartTitle =
            document.createElement(
                "div"
            );

        chartTitle.className =
            "section-title";

        chartTitle.textContent =
            "MTF Graph";

        body.appendChild(
            chartTitle
        );

        const graph =
            document.createElement(
                "div"
            );

        graph.className =
            "graph-container";

        const canvas =
            document.createElement(
                "canvas"
            );

        /*
         * Store chart data on canvas.
         */
        canvas.chartData =
            test.measurements;

        graph.appendChild(
            canvas
        );

        body.appendChild(
            graph
        );
    }

    wrapper.appendChild(header);
    wrapper.appendChild(body);

    return wrapper;
}


/* ============================================================
   MEASUREMENT TABLE
   ============================================================ */

function createMeasurementSection(
    title,
    measurements
) {

    const section =
        document.createElement(
            "div"
        );

    const titleElement =
        document.createElement(
            "div"
        );

    titleElement.className =
        "section-title";

    titleElement.textContent =
        title;

    section.appendChild(
        titleElement
    );

    const tableWrapper =
        document.createElement(
            "div"
        );

    tableWrapper.className =
        "mtf-table-wrapper";

    const table =
        document.createElement(
            "table"
        );

    const thead =
        document.createElement(
            "thead"
        );

    const headerRow =
        document.createElement(
            "tr"
        );

    [
        "MTF Item",
        "Value",
        "LL",
        "MIN",
        "MAX",
        "MEAN",
        "SIGMA",
        "Result"
    ].forEach(
        function(text) {

            const th =
                document.createElement(
                    "th"
                );

            th.textContent =
                text;

            headerRow.appendChild(
                th
            );
        }
    );

    thead.appendChild(
        headerRow
    );

    const tbody =
        document.createElement(
            "tbody"
        );

    measurements.forEach(
        function(m) {

            const row =
                document.createElement(
                    "tr"
                );

            row.className =
                m.result === "NG"
                    ? "ng-row"
                    : "pass-row";

            const values = [

                m.name,

                formatNumber(
                    m.value
                ),

                formatNumber(
                    m.lower
                ),

                formatNumber(
                    m.min
                ),

                formatNumber(
                    m.max
                ),

                formatNumber(
                    m.mean
                ),

                formatNumber(
                    m.sigma
                )

            ];

            values.forEach(
                function(value) {

                    const td =
                        document.createElement(
                            "td"
                        );

                    td.textContent =
                        value;

                    row.appendChild(
                        td
                    );
                }
            );

            const result =
                document.createElement(
                    "td"
                );

            result.textContent =
                m.result;

            result.className =
                m.result === "NG"
                    ? "result-ng"
                    : "result-pass";

            row.appendChild(
                result
            );

            tbody.appendChild(
                row
            );
        }
    );

    table.appendChild(
        thead
    );

    table.appendChild(
        tbody
    );

    tableWrapper.appendChild(
        table
    );

    section.appendChild(
        tableWrapper
    );

    return section;
}


/* ============================================================
   GRAPH
   ============================================================ */

function drawChart(canvas) {

    if (
        !canvas ||
        !canvas.chartData
    ) {

        return;
    }

    /*
     * Destroy old chart.
     */
    if (
        chartInstances[canvas]
    ) {

        chartInstances[canvas]
            .destroy();
    }

    const measurements =
        canvas.chartData;

    const labels =
        measurements.map(
            m => m.name
        );

    const values =
        measurements.map(
            m => m.value
        );

    const lower =
        measurements.map(
            m => m.lower
        );

    /*
     * Use a line for values and LL.
     *
     * UL intentionally removed.
     */
    const datasets = [

        {
            label: "MTF Value",

            data: values,

            borderWidth: 2,

            pointRadius: 4,

            tension: 0.2
        },

        {
            label: "LL",

            data: lower,

            borderWidth: 2,

            borderDash: [
                6,
                4
            ],

            pointRadius: 0,

            spanGaps: true
        }

    ];

    chartInstances[canvas] =
        new Chart(
            canvas.getContext("2d"),
            {

                type: "line",

                data: {

                    labels:
                        labels,

                    datasets:
                        datasets
                },

                options: {

                    responsive:
                        true,

                    maintainAspectRatio:
                        false,

                    interaction: {

                        mode:
                            "index",

                        intersect:
                            false
                    },

                    plugins: {

                        legend: {
                            display:
                                true
                        },

                        tooltip: {

                            callbacks: {

                                afterBody:
                                    function(
                                        context
                                    ) {

                                        const index =
                                            context[0]
                                                .dataIndex;

                                        const item =
                                            measurements[
                                                index
                                            ];

                                        return [
                                            "Result: " +
                                            item.result,

                                            "Type: " +
                                            item.type
                                        ];
                                    }
                            }
                        }
                    },

                    scales: {

                        x: {

                            ticks: {

                                autoSkip:
                                    false,

                                maxRotation:
                                    75,

                                minRotation:
                                    45
                            }
                        },

                        y: {

                            beginAtZero:
                                false
                        }
                    }
                }
            }
        );
}


/* ============================================================
   HELPERS
   ============================================================ */

function findHeader(
    headers,
    wanted
) {

    if (
        wanted === undefined ||
        wanted === null
    ) {

        return -1;
    }

    const target =
        String(wanted)
            .toLowerCase()
            .replace(/[\s_.-]/g, "");

    for (
        let i = 0;
        i < headers.length;
        i++
    ) {

        const current =
            String(headers[i] || "")
                .toLowerCase()
                .replace(/[\s_.-]/g, "");

        if (
            current === target
        ) {

            return i;
        }
    }

    return -1;
}


function getFirstExistingValue(
    row,
    indexes
) {

    for (
        const index of indexes
    ) {

        if (
            index !== undefined &&
            index !== null &&
            index >= 0 &&
            row[index] !== undefined &&
            String(row[index]).trim() !== ""
        ) {

            return String(
                row[index]
            ).trim();
        }
    }

    return "";
}


function getSpecValue(
    row,
    index
) {

    if (
        !row ||
        index < 0 ||
        index >= row.length
    ) {

        return null;
    }

    return toNumber(
        row[index]
    );
}


function toNumber(value) {

    if (
        value === undefined ||
        value === null
    ) {

        return null;
    }

    const text =
        String(value)
            .trim();

    if (
        text === "" ||
        text === "-" ||
        text.toLowerCase() === "na" ||
        text.toLowerCase() === "n/a"
    ) {

        return null;
    }

    /*
     * Keep normal scientific notation,
     * decimals and signs.
     */
    const cleaned =
        text.replace(
            /[^0-9eE+.\-]/g,
            ""
        );

    if (
        cleaned === ""
    ) {

        return null;
    }

    const number =
        Number(cleaned);

    return Number.isFinite(number)
        ? number
        : null;
}


function evaluateResult(
    value,
    lower,
    upper
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "GOOD";
    }

    if (
        lower !== null &&
        lower !== undefined &&
        value < lower
    ) {

        return "NG";
    }

    if (
        upper !== null &&
        upper !== undefined &&
        value > upper
    ) {

        return "NG";
    }

    return "GOOD";
}


function getMTFType(
    name
) {

    const upper =
        String(name || "")
            .toUpperCase();

    /*
     * VIS takes priority if an item somehow
     * contains both terms.
     */
    if (
        upper.includes("VIS")
    ) {

        return "VIS";
    }

    if (
        upper.includes("IR")
    ) {

        return "IR";
    }

    return "OTHER";
}


function cleanSN(sn) {

    if (
        sn === undefined ||
        sn === null
    ) {

        return "";
    }

    let value =
        String(sn).trim();

    /*
     * Remove CSV quotes.
     */
    value =
        value.replace(
            /^["']|["']$/g,
            ""
        );

    /*
     * Don't turn empty strings into
     * fake serial numbers.
     */
    if (
        value === ""
    ) {

        return "";
    }

    return value;
}


function formatNumber(
    value
) {

    if (
        value === null ||
        value === undefined ||
        Number.isNaN(value)
    ) {

        return "—";
    }

    return Number(value)
        .toFixed(3)
        .replace(/\.?0+$/, "");
}


/* ============================================================
   ERROR
   ============================================================ */

function showError(
    message
) {

    const box =
        document
            .getElementById("errorBox");

    box.textContent =
        message;

    box.style.display =
        "block";
}


function hideError() {

    const box =
        document
            .getElementById("errorBox");

    box.style.display =
        "none";

    box.textContent =
        "";
}


/* ============================================================
   CLEAR
   ============================================================ */

function clearAll() {

    document
        .getElementById("logInput")
        .value = "";

    document
        .getElementById("fileInput")
        .value = "";

    document
        .getElementById("fileInfo")
        .textContent = "";

    document
        .getElementById("summaryCard")
        .style.display =
            "none";

    document
        .getElementById("resultsCard")
        .style.display =
            "none";

    document
        .getElementById("resultList")
        .innerHTML = "";

    groupedData = {};

    Object.values(
        chartInstances
    ).forEach(
        function(chart) {

            try {
                chart.destroy();
            } catch(e) {}

        }
    );

    chartInstances = {};

    hideError();
}
